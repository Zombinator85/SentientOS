[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "sentientos"
version = "1.2.0-beta"
description = "Ledger-based automation framework enforcing sanctuary privilege."
authors = ["SentientOS"]
readme = "README.md"
packages = [
    {include = "sentientos"},
    {include = "api"},
    {include = "gui"},
    {include = "apps"},
]

[project]
name = "sentientos"
version = "1.2.0-beta"
description = "Ledger-based automation framework enforcing sanctuary privilege."
readme = "README.md"
authors = [{name = "SentientOS"}]
license = {text = "MIT"}
requires-python = ">=3.8"

# Core installation deliberately has no third-party capability dependencies.
# Capabilities are selected explicitly from the groups below.
dependencies = []

[project.optional-dependencies]
codex = [
    "pytest>=7,<9; python_version < '3.14'",
    "pytest>=8.4,<9; python_version >= '3.14'",
    "pytest-cov>=4,<7",
    "fastapi>=0.110,<1",
    "starlette>=0.37,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "packaging>=23,<27",
]
test = ["pytest>=7,<9; python_version < '3.14'", "pytest>=8.4,<9; python_version >= '3.14'", "pytest-cov>=4,<7"]
dev = ["mypy>=1.5,<2", "types-requests>=2.32", "types-PyYAML", "pip-tools>=7,<8"]
docs = ["mkdocs>=1.6,<2", "watchdog>=2,<3", "sphinx>=7,<9", "sphinx-autodoc-typehints", "myst-parser", "sphinxawesome-theme", "sphinx-autobuild"]
web = ["Flask>=2.2,<3", "Flask-SocketIO>=5,<6", "Werkzeug>=2.3,<3", "python-socketio>=5,<6", "python-engineio>=4,<5", "fastapi>=0.110,<1", "uvicorn>=0.23,<1", "streamlit>=1,<2", "python-multipart>=0.0.20"]
audio = ["pyttsx3>=2,<3", "SpeechRecognition>=3,<4", "sounddevice>=0.4,<1", "pydub>=0.25,<1", "vosk>=0.3,<1", "librosa>=0.10,<1", "playsound>=1,<2", "edge-tts"]
neuro = ["mne>=1,<2", "brainflow>=5,<6", "pyserial>=3,<4", "pandas>=1.5,<2; python_version < '3.14'"]
ml = ["transformers>=4,<5"]
windows = ["pywin32>=306; sys_platform == 'win32'", "pywin32-ctypes>=0.2,<1; sys_platform == 'win32'", "pypiwin32>=223; sys_platform == 'win32'", "comtypes>=1.2,<2; sys_platform == 'win32'"]
runtime = ["requests>=2.31,<3", "python-dotenv>=0.21,<1", "colorama>=0.4,<1", "cryptography>=42,<43", "keyring>=24,<25", "mss>=9,<11", "psutil>=5,<6", "pdfrw>=0.4,<1", "fastcore>=1.7.2", "ghapi>=1,<2"]
full = [
    "pytest>=7,<9; python_version < '3.14'",
    "pytest>=8.4,<9; python_version >= '3.14'",
    'pytest-cov>=4,<7',
    'fastapi>=0.110,<1',
    'starlette>=0.37,<1',
    'httpx>=0.27,<1',
    'PyYAML>=6,<7',
    'packaging>=23,<27',
    'mypy>=1.5,<2',
    'types-requests>=2.32',
    'types-PyYAML',
    'pip-tools>=7,<8',
    'mkdocs>=1.6,<2',
    'watchdog>=2,<3',
    'sphinx>=7,<9',
    'sphinx-autodoc-typehints',
    'myst-parser',
    'sphinxawesome-theme',
    'sphinx-autobuild',
    'Flask>=2.2,<3',
    'Flask-SocketIO>=5,<6',
    'Werkzeug>=2.3,<3',
    'python-socketio>=5,<6',
    'python-engineio>=4,<5',
    'uvicorn>=0.23,<1',
    'streamlit>=1,<2',
    'python-multipart>=0.0.20',
    'pyttsx3>=2,<3',
    'SpeechRecognition>=3,<4',
    'sounddevice>=0.4,<1',
    'pydub>=0.25,<1',
    'vosk>=0.3,<1',
    'librosa>=0.10,<1',
    'playsound>=1,<2',
    'edge-tts',
    'mne>=1,<2',
    'brainflow>=5,<6',
    'pyserial>=3,<4',
    "pandas>=1.5,<2; python_version < '3.14'",
    'transformers>=4,<5',
    "pywin32>=306; sys_platform == 'win32'",
    "pywin32-ctypes>=0.2,<1; sys_platform == 'win32'",
    "pypiwin32>=223; sys_platform == 'win32'",
    "comtypes>=1.2,<2; sys_platform == 'win32'",
    'requests>=2.31,<3',
    'python-dotenv>=0.21,<1',
    'colorama>=0.4,<1',
    'cryptography>=42,<43',
    'keyring>=24,<25',
    'mss>=9,<11',
    'psutil>=5,<6',
    'pdfrw>=0.4,<1',
    'fastcore>=1.7.2',
    'ghapi>=1,<2',
]
tts = ["edge-tts"]
bin = []
src = []

[project.scripts]
support = "support_cli:main"
ritual = "ritual_cli:main"
treasury = "treasury_cli:main"
avatar-gallery = "avatar_gallery_cli:main"
avatar-presence = "avatar_presence_cli:main"
review = "review_cli:main"
diff-memory = "diff_memory_cli:main"
theme = "theme_cli:main"
suggestion = "suggestion_cli:main"
trust = "trust_cli:main"
video = "video_cli:main"
plint-env = "scripts.plint_env:main"
cathedral-gui = "gui.cathedral_gui:main"
sentient-api = "sentient_api:app.run"
sentientosd = "sentientosd:main"
sentientos-chat = "sentientos.chat_service:run"
sentientos-updater = "updater:update"
sosctl = "sosctl:main"
verify_audits = "sentientos.verify_audits:main"
audit_immutability_verifier = "sentientos.vow_artifacts:run_immutability_verifier_main"
reconcile_audits = "scripts.reconcile_audits:main"
sentientos-reviewer-proof-bundle = "scripts.build_reviewer_proof_bundle:main"

[project.entry-points."sentientos.plugins"]
telegram-bot = "telegram_bot"
webhook-status-monitor = "webhook_status_monitor"
bridge-watchdog = "bridge_watchdog"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentientos", "api", "gui", "apps"]

[tool.setuptools]
py-modules = ["sentient_api"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests"]
files = ["sentientos"]
follow_imports = "skip"

[tool.privilege_lint]
required = false

[tool.pytest.ini_options]
addopts = "--cov=sentientos --cov-fail-under=80"
