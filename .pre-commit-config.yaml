repos:
  - repo: local
    hooks:
      - id: privilege-lint
        name: privilege lint
        entry: bash scripts/precommit_privilege_optional.sh
        language: system
        pass_filenames: false
      - id: audit-verify
        name: read-only audit chain verify
        entry: python -m scripts.check_audit_chain
        language: system
        pass_filenames: false
      - id: pytest
        name: unit tests
        entry: python -m scripts.run_tests
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy baseline ratchet
        entry: python scripts/check_mypy_baseline.py
        language: system
        pass_filenames: false
