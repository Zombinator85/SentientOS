name: Release
on:
  push:
    tags: ['v4.*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and packaging tools
        run: python -m pip install -e ".[test]" build twine cyclonedx-bom
      - name: Validate candidate release without publication
        run: |
          python -c "import sentientos"
          python scripts/publish_release.py --noop --tag "${{ github.ref_name }}"
          python -m build

  publish:
    if: startsWith(github.ref, 'refs/tags/v4.')
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and release tooling
        run: python -m pip install -e ".[test]" build twine cyclonedx-bom
      - name: Verify release provenance
        run: ./scripts/verify_provenance.sh
      - name: Build and publish release
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python scripts/publish_release.py --tag "${{ github.ref_name }}"
      - name: Generate SBOM
        run: cyclonedx-py requirements requirements.txt --output-format JSON -o sbom.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          files: |
            dist/*.whl
            sbom.json
