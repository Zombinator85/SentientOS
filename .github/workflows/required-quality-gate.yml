name: Required Quality Gate

on:
  pull_request:
  push:
    branches: [main, 'codex/hosted-validation/**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Required / Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SentientOS test harness
        run: |
          python -m pip install --only-binary=:all: -r requirements-codex.txt
          python -m pip install --no-deps -e .
          python -m pip install 'mkdocs>=1.6,<2' 'watchdog>=2,<3'
          python -m pip check
      - name: Prove imports are inert
        run: python scripts/verify_import_inertness.py --output glow/test_runs/quality_gate_import_smoke.json
      - name: Prove pytest bootstrap is privilege-inert
        run: python scripts/verify_pytest_bootstrap.py --output glow/test_runs/quality_gate_pytest_bootstrap.json
      - name: Execute required call phases
        run: |
          python -m scripts.run_tests -q \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_import_is_inert \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_check_is_unprivileged \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_effects_authorize_before_mutation \
            tests/test_import_privilege_boundaries.py::test_actuator_import_has_no_privilege_or_runtime_effects \
            tests/test_import_privilege_boundaries.py::test_actuator_protected_effects_authorize_before_execution \
            tests/test_import_privilege_boundaries.py::test_external_plugins_are_rejected_without_execution \
            tests/test_ci_acceptance_fail_closed.py::test_bootstrap_failure_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_collection_failure_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_zero_collected_tests_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_missing_metrics_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_zero_call_phase_outcomes_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_complete_execution_is_validation_complete \
            tests/test_ci_acceptance_fail_closed.py::test_trend_analysis_rejects_zero_run_window \
            tests/test_ci_acceptance_fail_closed.py::test_integrity_ok_does_not_override_insufficient_validation \
            tests/test_github_hosted_acceptance_workflows.py::test_devcontainer_uses_private_virtualenv \
            tests/test_github_hosted_acceptance_workflows.py::test_disabled_accelerator_performs_no_setup \
            tests/test_github_hosted_acceptance_workflows.py::test_release_pr_validation_installs_project_without_publishing \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_and_verifies_real_tests \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_name_is_unique \
            tests/test_github_hosted_acceptance_workflows.py::test_prompt_assembler_invariant_runs_only_in_administrator_hosted_context \
            tests/test_github_hosted_acceptance_workflows.py::test_required_hosted_gate_emits_exact_sha_privileged_stage_evidence
      - name: Bind and verify exact acceptance
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open('glow/test_runs/test_run_provenance.json'))
          nodes=p['selected_node_ids']
          manifest={'schema_version':'sentientos.task_acceptance:v1','task_classification':'behavior_adding','repository_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'test_provenance_path':'glow/test_runs/test_run_provenance.json','required_nodes':[{'node_id':n} for n in nodes],'successful_path_nodes':nodes}
          open('glow/test_runs/quality_gate_acceptance.json','w').write(json.dumps(manifest,indent=2)+'\n')
          assert p['validation_status']=='validation_complete' and p['validation_complete'] is True
          assert p['tests_collected']>0 and p['tests_executed']>0 and p['call_phase_outcome_count']>0
          assert p['reporter_status']=='complete' and p['tests_failed']==0 and len(nodes)==21
          PY
          PYTHONPATH=. python scripts/verify_task_acceptance.py --manifest glow/test_runs/quality_gate_acceptance.json --provenance glow/test_runs/test_run_provenance.json --output glow/test_runs/quality_gate_acceptance_result.json
          python scripts/analyze_test_provenance.py --file glow/test_runs/test_run_provenance.json --dir /tmp/no-other-runs --output glow/test_runs/test_trend_report.json --verify-chain --require-validation-complete
      - name: Run full repository test suite
        id: broad_validation
        continue-on-error: true
        run: |
          set +e
          mkdir -p glow/test_runs
          python -m scripts.run_tests -q > glow/test_runs/hosted_broad_validation.log 2>&1
          broad_status=$?
          python - "$broad_status" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          status = int(sys.argv[1])
          report = {
              "status": "passed" if status == 0 else "failed",
              "exit_code": status,
              "command": ["python", "-m", "scripts.run_tests", "-q"],
              "head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "head_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
          }
          Path("glow/test_runs/hosted_broad_validation.json").write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          exit "$broad_status"
      - name: Run privileged hosted landing checks
        id: privileged_landing_checks
        env:
          HOSTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          sudo -n true
          sudo_status=$?
          sudo env "PATH=$PATH" python verify_audits.py --strict
          audit_status=$?
          sudo env "PATH=$PATH" python scripts/audit_immutability_verifier.py
          immutability_status=$?
          sudo env "PATH=$PATH" python scripts/build_docs.py --check-deps
          docs_check_status=$?
          sudo env "PATH=$PATH" python scripts/build_docs.py
          docs_build_status=$?
          python - "$sudo_status" "$audit_status" "$immutability_status" "$docs_check_status" "$docs_build_status" <<'PY'
          import json, os, sys
          import subprocess
          from pathlib import Path
          sudo_status, audit_status, immutability_status, docs_check_status, docs_build_status = map(int, sys.argv[1:])
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          actual_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if actual_sha != os.environ["HOSTED_HEAD_SHA"]:
              raise SystemExit("checked_out_revision_does_not_match_requested_candidate")
          stages = {
              "strict_audits": {"status": "passed" if sudo_status == 0 and audit_status == 0 else "failed", "exit_code": audit_status if sudo_status == 0 else sudo_status},
              "audit_immutability": {"status": "passed" if sudo_status == 0 and immutability_status == 0 else "failed", "exit_code": immutability_status if sudo_status == 0 else sudo_status},
              "docs_check_deps": {"status": "passed" if sudo_status == 0 and docs_check_status == 0 else "failed", "exit_code": docs_check_status if sudo_status == 0 else sudo_status},
              "docs_build": {"status": "passed" if sudo_status == 0 and docs_build_status == 0 else "failed", "exit_code": docs_build_status if sudo_status == 0 else sudo_status},
          }
          stages["broad_validation"] = json.loads(Path("glow/test_runs/hosted_broad_validation.json").read_text(encoding="utf-8"))
          success = all(row.get("status") == "passed" and row.get("exit_code") == 0 for row in stages.values())
          report = {
              "schema_version": "sentientos.hosted_validation:v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_file": ".github/workflows/required-quality-gate.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "head_sha": os.environ["HOSTED_HEAD_SHA"],
              "head_tree": actual_tree,
              "status": "completed",
              "conclusion": "success" if success else "failure",
              "stages": {
                  **stages,
              },
          }
          out = Path("glow/test_runs/hosted_privileged_validation.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          test "$sudo_status" -eq 0 && test "$audit_status" -eq 0 && test "$immutability_status" -eq 0 && test "$docs_check_status" -eq 0 && test "$docs_build_status" -eq 0
      - name: Require every hosted validation stage to pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("glow/test_runs/hosted_privileged_validation.json").read_text(encoding="utf-8"))
          stages = report.get("stages", {})
          required = {"broad_validation", "strict_audits", "audit_immutability", "docs_check_deps", "docs_build"}
          assert set(stages) >= required, "hosted_validation_stages_missing"
          failed = [name for name in sorted(required) if stages[name].get("status") != "passed" or stages[name].get("exit_code") != 0]
          assert not failed, "hosted_validation_stages_failed:" + ",".join(failed)
          assert report.get("conclusion") == "success", "hosted_validation_workflow_not_green"
          PY
      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-quality-gate-evidence
          path: |
            glow/test_runs/quality_gate_import_smoke.json
            glow/test_runs/quality_gate_pytest_bootstrap.json
            glow/test_runs/test_run_provenance.json
            glow/test_runs/quality_gate_acceptance_result.json
            glow/test_runs/test_trend_report.json
            glow/test_runs/hosted_privileged_validation.json
            glow/test_runs/hosted_broad_validation.json
            glow/test_runs/hosted_broad_validation.log
