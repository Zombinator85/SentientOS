name: Required Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/construct-sentientos*'
  merge_group:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Required / Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SentientOS test harness
        run: |
          python -m pip install --only-binary=:all: -r requirements-codex.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run strict audits with actual Administrator authority
        run: |
          test "$(sudo -n id -u)" = "0"
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python scripts/run_privileged_audit_verification.py \
              --expected-sha "$GITHUB_SHA" \
              --output glow/audits/privileged_audit_verification.json
      - name: Bootstrap minimal documentation tooling with hosted Administrator authority
        run: |
          test "$(sudo -n id -u)" = "0"
          sudo -n env "HOME=$HOME" "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            SENTIENTOS_HEADLESS=1 LUMOS_AUTO_APPROVE=1 \
            python scripts/build_docs.py --bootstrap-docs
      - name: Prove imports are inert
        run: python scripts/verify_import_inertness.py --output glow/test_runs/quality_gate_import_smoke.json
      - name: Prove pytest bootstrap is privilege-inert
        run: python scripts/verify_pytest_bootstrap.py --output glow/test_runs/quality_gate_pytest_bootstrap.json
      - name: Execute required call phases
        run: |
          python -m scripts.run_tests -q \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_import_is_inert \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_check_is_unprivileged \
            tests/test_import_privilege_boundaries.py::test_scripts_lock_effects_authorize_before_mutation \
            tests/test_import_privilege_boundaries.py::test_actuator_import_has_no_privilege_or_runtime_effects \
            tests/test_import_privilege_boundaries.py::test_actuator_protected_effects_authorize_before_execution \
            tests/test_import_privilege_boundaries.py::test_external_plugins_are_rejected_without_execution \
            tests/test_ci_acceptance_fail_closed.py::test_bootstrap_failure_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_collection_failure_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_zero_collected_tests_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_missing_metrics_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_zero_call_phase_outcomes_is_insufficient_evidence \
            tests/test_ci_acceptance_fail_closed.py::test_complete_execution_is_validation_complete \
            tests/test_ci_acceptance_fail_closed.py::test_trend_analysis_rejects_zero_run_window \
            tests/test_ci_acceptance_fail_closed.py::test_integrity_ok_does_not_override_insufficient_validation \
            tests/test_github_hosted_acceptance_workflows.py::test_devcontainer_uses_private_virtualenv \
            tests/test_github_hosted_acceptance_workflows.py::test_disabled_accelerator_performs_no_setup \
            tests/test_github_hosted_acceptance_workflows.py::test_release_pr_validation_installs_project_without_publishing \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_and_verifies_real_tests \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_pr_finalizer_with_hosted_administrator \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_name_is_unique \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_on_construction_candidate_pushes \
            tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_exact_nodes_after_import_smoke \
            tests/test_github_hosted_acceptance_workflows.py::test_workflow_dispatch_jobs_are_main_bound \
            tests/test_privileged_audit_verification.py::test_audit_result_validation_requires_successful_receipts_and_bound_contracts \
            tests/test_privileged_audit_verification.py::test_audit_result_validation_rejects_failed_receipt_and_stale_digest \
            tests/test_maintenance_resident_parent_supervision.py::test_restarted_parent_recovers_when_pid_is_reused_by_a_new_process_generation \
            tests/test_maintenance_resident_parent_supervision.py::test_linux_process_start_ticks_reads_live_procfs_generation \
            tests/test_maintenance_resident_parent_supervision.py::test_restarted_parent_fails_closed_when_prior_process_generation_is_still_live \
            tests/test_developmental_model_replacement_experiment.py::test_world_state_projection_preserves_declared_software_generation_without_claiming_observation \
            tests/test_sentientosd_resident_cognitive_transition_composition.py::test_production_transition_requires_verified_frozen_model_generation_lineage
      - name: Bind and verify exact acceptance
        run: |
          python - <<'PY'
          import json, subprocess
          p=json.load(open('glow/test_runs/test_run_provenance.json'))
          nodes=p['selected_node_ids']
          manifest={'schema_version':'sentientos.task_acceptance:v1','task_classification':'behavior_adding','repository_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'test_provenance_path':'glow/test_runs/test_run_provenance.json','required_nodes':[{'node_id':n} for n in nodes],'successful_path_nodes':nodes}
          open('glow/test_runs/quality_gate_acceptance.json','w').write(json.dumps(manifest,indent=2)+'\n')
          assert p['validation_status']=='validation_complete' and p['validation_complete'] is True
          assert p['tests_collected']>0 and p['tests_executed']>0 and p['call_phase_outcome_count']>0
          assert p['reporter_status']=='complete' and p['tests_failed']==0 and len(nodes)==30
          PY
          PYTHONPATH=. python scripts/verify_task_acceptance.py --manifest glow/test_runs/quality_gate_acceptance.json --provenance glow/test_runs/test_run_provenance.json --output glow/test_runs/quality_gate_acceptance_result.json
          python scripts/analyze_test_provenance.py --file glow/test_runs/test_run_provenance.json --dir /tmp/no-other-runs --output glow/test_runs/test_trend_report.json --verify-chain --require-validation-complete
      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-quality-gate-evidence
          path: |
            glow/test_runs/quality_gate_import_smoke.json
            glow/test_runs/quality_gate_pytest_bootstrap.json
            glow/test_runs/test_run_provenance.json
            glow/test_runs/quality_gate_acceptance_result.json
            glow/test_runs/test_trend_report.json
            glow/audits/privileged_audit_verification.json
            glow/audits/verify_audits_result.json
            glow/audits/audit_immutability_result.json
            glow/contracts/final_strict_audit_digest.json
            glow/contracts/strict_audit_status.json
            glow/contracts/strict_audit_breakdown.json
            glow/contracts/strict_audit_recovery_links.json
            glow/contracts/strict_audit_manifest.json
      - name: Freeze exact hosted acceptance for PR landing finalization
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos')
        run: |
          mkdir -p "$RUNNER_TEMP/sentientos-landing-acceptance"
          cp glow/test_runs/test_run_provenance.json \
            "$RUNNER_TEMP/sentientos-landing-acceptance/provenance.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sentientos-landing-acceptance"
          manifest=json.loads(Path("glow/test_runs/quality_gate_acceptance.json").read_text())
          manifest["test_provenance_path"]=str(root/"provenance.json")
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          python scripts/verify_task_acceptance.py \
            --manifest "$RUNNER_TEMP/sentientos-landing-acceptance/manifest.json" \
            --provenance "$RUNNER_TEMP/sentientos-landing-acceptance/provenance.json" \
            --output "$RUNNER_TEMP/sentientos-landing-acceptance/acceptance-result.json"
      - name: Restore generated test-run residue after evidence capture
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos')
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          source=os.environ["GITHUB_SHA"]
          tracked="glow/test_runs/test_run_provenance.json"
          status=subprocess.run(
              ["git","status","--porcelain","--untracked-files=all","--",tracked,"glow/test_runs/provenance"],
              check=True,capture_output=True,text=True,
          ).stdout.splitlines()
          for row in status:
              code,path=row[:2],row[3:]
              if path == tracked and code.strip() == "M":
                  subprocess.run(["git","restore","--",tracked],check=True)
                  continue
              if not path.startswith("glow/test_runs/provenance/") or code != "??":
                  raise SystemExit(f"unexpected test-evidence residue: {row}")
              target=Path(path)
              if source[:12] not in target.name or target.is_symlink() or not target.is_file():
                  raise SystemExit(f"unbound test-provenance residue: {path}")
              tracked_check=subprocess.run(["git","ls-files","--error-unmatch","--",path],capture_output=True)
              if tracked_check.returncode == 0:
                  raise SystemExit(f"refusing to remove tracked provenance: {path}")
              target.unlink()
          PY
      - name: Reconstruct and verify exact hosted pre-commit state
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(sudo -n id -u)" = "0"
          COMMIT_REF="${PR_HEAD_SHA:-$GITHUB_SHA}"
          COMMIT_TITLE="$(git log -1 --format=%s "$COMMIT_REF")"
          PR_TITLE="${PR_TITLE:-$COMMIT_TITLE}"
          test "$PR_TITLE" = "$COMMIT_TITLE"
          PRECOMMIT_PARENT="$(git rev-parse "$COMMIT_REF^")"
          PRECOMMIT_WORKSPACE="$RUNNER_TEMP/sentientos-precommit-workspace"
          PRECOMMIT_TEST_RUN_DIR="$RUNNER_TEMP/sentientos-precommit-tests"
          PRECOMMIT_FINALIZER_TEST_RUN_DIR="$RUNNER_TEMP/sentientos-precommit-finalizer-tests"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$PRECOMMIT_WORKSPACE" "$PRECOMMIT_PARENT"
          git diff --binary "$PRECOMMIT_PARENT" "$COMMIT_REF" | git -C "$PRECOMMIT_WORKSPACE" apply --index
          python -m pip install --no-deps --no-build-isolation -e "$PRECOMMIT_WORKSPACE"
          python - "$RUNNER_TEMP/sentientos-landing-acceptance/provenance.json" \
            "$PRECOMMIT_WORKSPACE" "$PRECOMMIT_PARENT" "$PRECOMMIT_TEST_RUN_DIR" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          source_provenance, workspace, expected_head, test_run_dir = sys.argv[1:]
          candidate = json.loads(Path(source_provenance).read_text())
          nodes = candidate.get("selected_node_ids")
          if not isinstance(nodes, list) or len(nodes) != 30 or not all(isinstance(node, str) for node in nodes):
              raise SystemExit("hosted candidate acceptance must contain the exact 30 required nodes")
          run_dir = Path(test_run_dir)
          run_dir.mkdir(parents=True, exist_ok=True)
          env = os.environ.copy()
          env["SENTIENTOS_TEST_RUN_DIR"] = str(run_dir)
          result = subprocess.run([sys.executable, "-m", "scripts.run_tests", "-q", *nodes],
                                  cwd=workspace, env=env, check=False)
          if result.returncode:
              raise SystemExit(result.returncode)
          provenance_path = run_dir / "test_run_provenance.json"
          provenance = json.loads(provenance_path.read_text())
          if provenance.get("git_sha") != expected_head or provenance.get("validation_status") != "validation_complete":
              raise SystemExit("pre-commit test provenance is not bound to the exact parent workspace")
          selected = provenance.get("selected_node_ids")
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": expected_head,
              "test_provenance_path": str(provenance_path),
              "required_nodes": [{"node_id": node} for node in selected],
              "successful_path_nodes": selected,
          }
          manifest_path = run_dir / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          subprocess.run([sys.executable, "scripts/verify_task_acceptance.py", "--manifest", str(manifest_path),
                          "--provenance", str(provenance_path), "--output", str(run_dir / "acceptance-result.json")],
                         cwd=workspace, env={**env, "PYTHONPATH": workspace}, check=True)
          PY
          cd "$PRECOMMIT_WORKSPACE"
          set +e
          sudo -n env "HOME=$HOME" "PATH=$PATH" "PYTHONPATH=$PRECOMMIT_WORKSPACE" \
            SENTIENTOS_TEST_RUN_DIR="$PRECOMMIT_FINALIZER_TEST_RUN_DIR" \
            python scripts/codex_finalize_landing.py finalize \
              --phase pre-commit \
              --validation-profile solo \
              --title "$COMMIT_TITLE" \
              --intended-commit-title "$COMMIT_TITLE" \
              --workspace-root "$PRECOMMIT_WORKSPACE" \
              --task-acceptance-manifest "$PRECOMMIT_TEST_RUN_DIR/manifest.json" \
              --focused-test-command "python -m scripts.run_tests -q tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_and_verifies_real_tests" \
              --allow-current-tracked-changes \
              --allow-current-task-files \
              --allow-generated-artifact-cleanup \
              --output "$RUNNER_TEMP/codex-finalizer-pre-commit.json" \
              --stage-timeout-seconds 1200 \
              --overall-timeout-seconds 5400 \
              --summary
          finalizer_exit_code=$?
          set -e
          printf "Pre-commit finalizer process exit code: %s\\n" "$finalizer_exit_code"
          cat "$RUNNER_TEMP/codex-finalizer-pre-commit.json"
          python - "$RUNNER_TEMP/codex-finalizer-pre-commit.json" "$finalizer_exit_code" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          decision=payload.get("decision",{})
          status=decision.get("status")
          reasons=decision.get("reasons",[])
          print(json.dumps({"finalizer_exit_code": int(sys.argv[2]), "status": status, "reasons": reasons}, sort_keys=True))
          if int(sys.argv[2]) != 0 or status != "ready_to_commit":
              raise SystemExit(f"hosted reconstructed pre-commit finalizer blocked: {status}: {reasons}")
          PY
          cd "$GITHUB_WORKSPACE"
          python -m pip install --no-deps --no-build-isolation -e "$GITHUB_WORKSPACE"
          test "$PRECOMMIT_WORKSPACE" = "$RUNNER_TEMP/sentientos-precommit-workspace"
          sudo -n git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" \
            worktree remove --force "$PRECOMMIT_WORKSPACE"
      - name: Complete hosted privileged PR landing finalization
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(sudo -n id -u)" = "0"
          COMMIT_REF="${PR_HEAD_SHA:-HEAD}"
          COMMIT_TITLE="$(git log -1 --format=%s "$COMMIT_REF")"
          PR_TITLE="${PR_TITLE:-$COMMIT_TITLE}"
          test "$PR_TITLE" = "$COMMIT_TITLE"
          METADATA_WORKSPACE="$GITHUB_WORKSPACE"
          ACCEPTANCE_MANIFEST="$RUNNER_TEMP/sentientos-landing-acceptance/manifest.json"
          if [ -n "$PR_HEAD_SHA" ]; then
            METADATA_WORKSPACE="$RUNNER_TEMP/sentientos-candidate-workspace"
            CANDIDATE_ACCEPTANCE_DIR="$RUNNER_TEMP/sentientos-candidate-acceptance"
            CANDIDATE_TEST_RUN_DIR="$RUNNER_TEMP/sentientos-candidate-tests"
            mkdir -p "$CANDIDATE_ACCEPTANCE_DIR" "$CANDIDATE_TEST_RUN_DIR"
            GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$METADATA_WORKSPACE" "$COMMIT_REF"
            python - "$RUNNER_TEMP/sentientos-landing-acceptance/provenance.json" \
              "$METADATA_WORKSPACE" "$COMMIT_REF" "$CANDIDATE_TEST_RUN_DIR" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          source_provenance, workspace, expected_head, test_run_dir = sys.argv[1:]
          initial = json.loads(Path(source_provenance).read_text())
          nodes = initial.get("selected_node_ids")
          if not isinstance(nodes, list) or len(nodes) != 30 or not all(isinstance(node, str) for node in nodes):
              raise SystemExit("candidate acceptance must contain the exact 30 required nodes")
          run_dir = Path(test_run_dir)
          run_dir.mkdir(parents=True, exist_ok=True)
          env = {**os.environ, "PYTHONPATH": workspace, "SENTIENTOS_TEST_RUN_DIR": str(run_dir)}
          result = subprocess.run([sys.executable, "-m", "scripts.run_tests", "-q", *nodes],
                                  cwd=workspace, env=env, check=False)
          if result.returncode:
              raise SystemExit(result.returncode)
          provenance_path = run_dir / "test_run_provenance.json"
          provenance = json.loads(provenance_path.read_text())
          if provenance.get("git_sha") != expected_head or provenance.get("validation_status") != "validation_complete":
              raise SystemExit("candidate provenance is not bound to the exact PR head")
          selected = provenance.get("selected_node_ids")
          if selected != nodes:
              raise SystemExit("candidate provenance selected a different required-node set")
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": expected_head,
              "test_provenance_path": str(provenance_path),
              "required_nodes": [{"node_id": node} for node in selected],
              "successful_path_nodes": selected,
          }
          manifest_path = Path(workspace).parent / "sentientos-candidate-acceptance" / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          acceptance_result = manifest_path.parent / "acceptance-result.json"
          subprocess.run([sys.executable, "scripts/verify_task_acceptance.py", "--manifest", str(manifest_path),
                          "--provenance", str(provenance_path), "--output", str(acceptance_result)],
                         cwd=workspace, env=env, check=True)
          PY
            cp "$CANDIDATE_TEST_RUN_DIR/test_run_provenance.json" "$CANDIDATE_ACCEPTANCE_DIR/provenance.json"
            python - "$CANDIDATE_ACCEPTANCE_DIR/manifest.json" "$CANDIDATE_ACCEPTANCE_DIR/provenance.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifest_path, provenance_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text())
          manifest["test_provenance_path"] = str(provenance_path)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
            cd "$METADATA_WORKSPACE"
            PYTHONPATH="$METADATA_WORKSPACE" python "$METADATA_WORKSPACE/scripts/verify_task_acceptance.py" \
              --manifest "$CANDIDATE_ACCEPTANCE_DIR/manifest.json" \
              --provenance "$CANDIDATE_ACCEPTANCE_DIR/provenance.json" \
              --output "$CANDIDATE_ACCEPTANCE_DIR/acceptance-result.json"
            ACCEPTANCE_MANIFEST="$CANDIDATE_ACCEPTANCE_DIR/manifest.json"
          fi
          echo "SENTIENTOS_METADATA_WORKSPACE=$METADATA_WORKSPACE" >> "$GITHUB_ENV"
          echo "SENTIENTOS_POSTCOMMIT_ACCEPTANCE_MANIFEST=$ACCEPTANCE_MANIFEST" >> "$GITHUB_ENV"
          cd "$METADATA_WORKSPACE"
          sudo -n env "HOME=$HOME" "PATH=$PATH" "PYTHONPATH=$METADATA_WORKSPACE" \
            SENTIENTOS_TEST_RUN_DIR="$RUNNER_TEMP/sentientos-landing-test-runs" \
            python scripts/codex_finalize_landing.py finalize \
              --phase pr-metadata \
              --validation-profile solo \
              --title "$PR_TITLE" \
              --intended-commit-title "$COMMIT_TITLE" \
              --pre-commit-finalizer-json "$RUNNER_TEMP/codex-finalizer-pre-commit.json" \
              --task-acceptance-manifest "$ACCEPTANCE_MANIFEST" \
              --focused-test-command "python -m scripts.run_tests -q tests/test_github_hosted_acceptance_workflows.py::test_required_quality_gate_runs_and_verifies_real_tests" \
              --allow-generated-artifact-cleanup \
              --output "$RUNNER_TEMP/codex-finalizer-pr-metadata.json" \
              --stage-timeout-seconds 1200 \
              --overall-timeout-seconds 5400 \
              --summary
      - name: Verify pre-publication PR metadata guard
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          COMMIT_REF="${PR_HEAD_SHA:-HEAD}"
          METADATA_WORKSPACE="${SENTIENTOS_METADATA_WORKSPACE:-$GITHUB_WORKSPACE}"
          COMMIT_TITLE="$(git log -1 --format=%s "$COMMIT_REF")"
          PR_TITLE="${PR_TITLE:-$COMMIT_TITLE}"
          test "$PR_TITLE" = "$COMMIT_TITLE"
          cd "$METADATA_WORKSPACE"
          set +e
          PYTHONPATH="$METADATA_WORKSPACE" python scripts/codex_pr_metadata_guard.py verify \
            --title "$PR_TITLE" \
            --intended-commit-title "$COMMIT_TITLE" \
            --pre-commit-finalizer-json "$RUNNER_TEMP/codex-finalizer-pre-commit.json" \
            --pr-metadata-finalizer-json "$RUNNER_TEMP/codex-finalizer-pr-metadata.json" \
            --matrix-json-path "$RUNNER_TEMP/solo-matrix-not-requested.json" \
            --workspace-root "$METADATA_WORKSPACE" \
            > "$RUNNER_TEMP/codex-pr-metadata-guard.json"
          guard_exit=$?
          set -e
          python - "$RUNNER_TEMP/codex-pr-metadata-guard.json" "$guard_exit" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          if payload.get("status") != "pr_metadata_guard_ready":
              print(json.dumps({"status": payload.get("status"), "reasons": payload.get("reasons")}, sort_keys=True), file=sys.stderr)
              raise SystemExit(f"pre-publication metadata guard blocked (exit {sys.argv[2]}): {payload.get('status')}")
          if int(sys.argv[2]) != 0:
              raise SystemExit(f"pre-publication metadata guard exited {sys.argv[2]} after reporting ready")
          print(f"Codex PR metadata guard decision: {payload['status']}")
          PY
      - name: Remove exact PR candidate workspace
        if: always() && github.event_name == 'pull_request'
        run: |
          CANDIDATE_WORKSPACE="$RUNNER_TEMP/sentientos-candidate-workspace"
          test "$CANDIDATE_WORKSPACE" = "$RUNNER_TEMP/sentientos-candidate-workspace"
          if [ -e "$CANDIDATE_WORKSPACE/.git" ]; then
            test "$(sudo -n id -u)" = "0"
            sudo -n git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" \
              worktree remove --force "$CANDIDATE_WORKSPACE"
          fi
      - name: Upload hosted privileged PR landing finalizer evidence
        if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/construct-sentientos'))
        uses: actions/upload-artifact@v4
        with:
          name: hosted-privileged-pr-landing-finalizer
          path: |
            ${{ runner.temp }}/codex-finalizer-pr-metadata.json
            ${{ runner.temp }}/codex-finalizer-pre-commit.json
            ${{ runner.temp }}/codex-pr-metadata-guard.json
            ${{ runner.temp }}/sentientos-landing-acceptance/manifest.json
            ${{ runner.temp }}/sentientos-landing-acceptance/provenance.json
