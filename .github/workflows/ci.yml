              'tests/test_federation_stream_relay.py::test_decode_event_line_rejects_ambiguous_or_nonstandard_json[{"value":-1e9999}]',
              "tests/test_federation_stream_relay.py::test_decode_event_line_accepts_finite_float",
              "tests/test_federation_stream_relay.py::test_decode_event_line_accepts_object_and_binds_configured_source",
              "tests/test_github_hosted_acceptance_workflows.py::test_source_validation_runs_federation_relay_json_regressions",
