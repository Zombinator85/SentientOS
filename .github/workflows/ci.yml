name: CI

on:
  push:
  pull_request:

env:
  PULSE_TRUST_EPOCH_ROOT: .ci-runtime/pulse-trust-epoch
  PULSE_TRUST_EPOCH_STATE: .ci-runtime/pulse-trust-epoch/epoch_state.json

jobs:
  source-validation:
    name: Source validation (unprivileged)
    runs-on: ubuntu-latest
    env:
      SENTIENTOS_HEADLESS: "1"
      SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/governor
      SENTIENTOS_FEDERATION_ROOT: .ci-runtime/federation
      SENTIENTOS_CI_MIN_PASSED: "1"
      SENTIENTOS_CI_MAX_SKIP_RATE: "0.20"
      SENTIENTOS_CI_MAX_XFAIL_RATE: "0.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mark current test-run provenance cutoff
        run: touch "$RUNNER_TEMP/sentientos-test-run-started"
      - name: Verify append-only construction custody
        run: python scripts/verify_construction_continuation_custody.py --repo-root . --summary
      - name: Install canonical test airlock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install --only-binary=:all: -r requirements-codex.txt
      - name: Run explicit World-State and resource-join controls
        run: |
          python -m scripts.run_tests -- -m legacy -q \
            tests/test_world_state_board.py::test_world_state_snapshot_boundaries_and_authority_false \
            tests/test_world_state_sources.py::test_manifest_bounds_path_safety_and_dedup \
            tests/test_resource_invocation_process_generation_integration.py::test_parent_child_resource_invocation_generation_reaches_world_state
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          root = Path("glow/test_runs")
          provenance = root / "test_run_provenance.json"
          if not provenance.is_file():
              raise SystemExit("World-State supplemental run produced no provenance")
          saved = root / "world_state_contracts_provenance.json"
          saved.write_bytes(provenance.read_bytes())
          nodes = [
              "tests/test_world_state_board.py::test_world_state_snapshot_boundaries_and_authority_false",
              "tests/test_world_state_sources.py::test_manifest_bounds_path_safety_and_dedup",
              "tests/test_resource_invocation_process_generation_integration.py::test_parent_child_resource_invocation_generation_reaches_world_state",
          ]
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": os.environ["GITHUB_SHA"],
              "test_provenance_path": str(saved),
              "required_nodes": [{"node_id": node, "rationale": "explicitly exercise the quarantined read-only World-State/resource bridge"} for node in nodes],
              "successful_path_nodes": nodes,
          }
          manifest_path = root / "world_state_contracts_acceptance.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYCODE
          python -m scripts.verify_task_acceptance \
            --manifest glow/test_runs/world_state_contracts_acceptance.json \
            --provenance glow/test_runs/world_state_contracts_provenance.json \
            --output glow/test_runs/world_state_contracts_acceptance_result.json
      - name: Run integrated resource-to-cognition lifecycle
        run: |
          python -m scripts.run_tests -q \
            tests/test_world_state_board.py \
            tests/test_world_state_sources.py \
            tests/test_resource_invocation_process_generation_integration.py \
            tests/test_local_model_chat_recovery.py \
            tests/test_local_model_chat_runtime_startup.py \
            tests/test_resident_epistemic_development.py \
            tests/test_persistent_epistemic_state.py \
            tests/test_resident_developmental_writeback.py \
            tests/test_resident_developmental_cognition_generation_scope.py \
            tests/test_developmental_history_intervention_experiment.py \
            tests/test_resident_developmental_cognition.py \
            tests/test_developmental_model_replacement_experiment.py \
            tests/test_local_model_production_serving.py \
            tests/test_resident_epistemic_state_mutation.py \
            tests/test_local_model_catalog_deployment_capability_admission.py \
            tests/test_pytest_collection_reporter.py \
            tests/test_run_tests_failure_digest.py \
            tests/test_run_tests_bootstrap_airlock.py \
            tests/test_task_acceptance_verifier.py \
            tests/test_github_hosted_acceptance_workflows.py \
            tests/test_stage_current_test_artifacts.py \
            tests/test_import_inertness_verifier.py \
            tests/integrity/test_import_purity.py
      - name: Verify exact resource-to-cognition acceptance nodes
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          import shutil
          shutil.copyfile(
              "glow/test_runs/test_run_provenance.json",
              "glow/test_runs/source_validation_provenance.json",
          )

          nodes = [
              "tests/test_pytest_collection_reporter.py::test_reporter_records_setup_skip_without_claiming_a_call",
              "tests/test_pytest_collection_reporter.py::test_reporter_records_setup_xfail_as_xfailed_not_skipped",
              "tests/test_run_tests_failure_digest.py::test_successful_run_removes_prior_failure_digest",
              "tests/test_run_tests_bootstrap_airlock.py::test_minimal_airlock_pytest_constraint_matches_project_declaration",
              "tests/test_task_acceptance_verifier.py::test_setup_phase_skip_cannot_satisfy_a_required_call_node",
              "tests/test_local_model_chat_recovery.py::test_restart_preserves_resource_provisioning_identity",
              "tests/test_resident_epistemic_development.py::test_restart_between_evidence_and_state_deduplicates_and_continues",
              "tests/test_resident_epistemic_development.py::test_equal_tick_updates_remain_fair_after_owner_restart",
              "tests/test_resident_epistemic_development.py::test_generation_is_not_served_until_committed_receipt_recovers",
              "tests/test_resident_epistemic_state_mutation.py::test_missing_update_event_keeps_admitted_generation_unverified",
              "tests/test_resident_epistemic_state_mutation.py::test_conflicting_admission_bound_transactions_do_not_recover",
              "tests/test_resident_epistemic_state_mutation.py::test_duplicate_transaction_record_cannot_recover",
              "tests/test_resident_developmental_writeback.py::test_successful_selected_evidence_candidate_admitted_append_receipt_retrieval_and_restart",
              "tests/test_resident_developmental_cognition.py::test_restart_tick_n_plus_one_retrieves_prior_history_for_cognition",
              "tests/test_resident_developmental_cognition.py::test_real_invoker_retains_distinct_lessons_and_later_tick_reads_them",
              "tests/test_developmental_model_replacement_experiment.py::test_serving_receipt_references_survive_controlled_run_recovery",
          ]
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": os.environ["GITHUB_SHA"],
              "test_provenance_path": "glow/test_runs/source_validation_provenance.json",
              "required_nodes": [{"node_id": node, "rationale": "source-validation must exercise the exact resource-to-cognition and provenance handoff"} for node in nodes],
              "successful_path_nodes": nodes,
          }
          Path("glow/test_runs/source_validation_acceptance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYCODE
          python -m scripts.verify_task_acceptance \
            --manifest glow/test_runs/source_validation_acceptance.json \
            --provenance glow/test_runs/source_validation_provenance.json \
            --output glow/test_runs/source_validation_acceptance_result.json
      - name: Verify canonical planning and execution separation
        run: |
          python -m scripts.run_tests -- -m "legacy or no_legacy_skip" -q \
            sentientos/tests/test_orchestrator_plan_only.py::test_canonical_plan_import_and_composition_do_not_load_goal_executor \
            sentientos/tests/test_orchestrator_plan_only.py::test_daemon_planning_binds_verified_owner_and_observed_identity_without_execution \
            sentientos/tests/test_orchestrator_plan_only.py::test_verified_prior_epistemic_position_changes_canonical_goal_allocation \
            sentientos/tests/test_orchestrator_plan_only.py::test_receipt_verified_prior_state_changes_daemon_plan_only_after_recovery \
            sentientos/tests/test_orchestrator_plan_only.py::test_receipt_verified_outcomes_change_canonical_goal_selection_after_recovery \
            sentientos/tests/test_epistemic_planning.py::test_supported_model_bound_position_requires_exact_identity_and_reaches_plan_evidence \
            sentientos/tests/test_goal_executor_plan.py::test_build_plan_is_deterministic_and_budgeted \
            sentientos/tests/test_goal_executor_run.py::test_execute_rejects_plan_time_mismatch_before_any_effect_or_journal \
            sentientos/tests/test_goal_executor_run.py::test_execute_rejects_changed_canonical_evidence_before_task_effect \
            sentientos/tests/test_orchestrator_goal_execution.py::test_tick_emits_work_plan_and_run_and_index_fields \
            sentientos/tests/test_work_plan_execution_journal.py::test_journal_binds_task_events_to_exact_plan_identity \
            sentientos/tests/test_work_plan_cli.py::test_canonical_cli_plan_without_evidence_fails_before_execution_policy \
            sentientos/tests/test_work_plan_cli.py::test_canonical_cli_passes_verified_evidence_digest_to_executor \
            sentientos/tests/test_work_plan_evidence_bounds.py::test_large_epistemic_evidence_round_trips_exactly_through_immutable_sidecar \
            sentientos/tests/test_work_plan_evidence_bounds.py::test_large_epistemic_evidence_sidecar_tampering_fails_closed \
            sentientos/tests/test_orchestrator_plan_only.py::test_daemon_plan_feedback_is_non_authorizing_and_execution_free \
            tests/test_sentientosd_runtime_closure.py::test_maintenance_tick_orders_campaign_signal_world_state_and_cognition \
            tests/test_repository_mutation_custody_regression.py::test_runtime_handoff_emission_external_root_no_state_change_or_repo_dirty \
            tests/test_privileged_audit_verification.py::test_privileged_audit_wrapper_rejects_non_root_before_running_checks \
            tests/test_privileged_audit_verification.py::test_required_quality_gate_binds_root_audits_to_exact_checkout \
            tests/test_privileged_audit_verification.py::test_root_audit_result_is_uploaded_with_quality_gate_evidence \
            sentientos/tests/test_work_plan_cli.py::test_cli_execution_uses_current_integrity_pressure_to_bound_mutation
          cp glow/test_runs/test_run_provenance.json \
            glow/test_runs/canonical_planning_provenance.json
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          nodes = [
              "sentientos/tests/test_orchestrator_plan_only.py::test_canonical_plan_import_and_composition_do_not_load_goal_executor",
              "sentientos/tests/test_orchestrator_plan_only.py::test_daemon_planning_binds_verified_owner_and_observed_identity_without_execution",
              "sentientos/tests/test_orchestrator_plan_only.py::test_verified_prior_epistemic_position_changes_canonical_goal_allocation",
              "sentientos/tests/test_orchestrator_plan_only.py::test_receipt_verified_prior_state_changes_daemon_plan_only_after_recovery",
              "sentientos/tests/test_orchestrator_plan_only.py::test_receipt_verified_outcomes_change_canonical_goal_selection_after_recovery",
              "sentientos/tests/test_epistemic_planning.py::test_supported_model_bound_position_requires_exact_identity_and_reaches_plan_evidence",
              "sentientos/tests/test_goal_executor_plan.py::test_build_plan_is_deterministic_and_budgeted",
              "sentientos/tests/test_goal_executor_run.py::test_execute_rejects_plan_time_mismatch_before_any_effect_or_journal",
              "sentientos/tests/test_goal_executor_run.py::test_execute_rejects_changed_canonical_evidence_before_task_effect",
              "sentientos/tests/test_orchestrator_goal_execution.py::test_tick_emits_work_plan_and_run_and_index_fields",
              "sentientos/tests/test_work_plan_execution_journal.py::test_journal_binds_task_events_to_exact_plan_identity",
              "sentientos/tests/test_work_plan_cli.py::test_canonical_cli_plan_without_evidence_fails_before_execution_policy",
              "sentientos/tests/test_work_plan_cli.py::test_canonical_cli_passes_verified_evidence_digest_to_executor",
              "sentientos/tests/test_work_plan_evidence_bounds.py::test_large_epistemic_evidence_round_trips_exactly_through_immutable_sidecar",
              "sentientos/tests/test_work_plan_evidence_bounds.py::test_large_epistemic_evidence_sidecar_tampering_fails_closed",
              "sentientos/tests/test_orchestrator_plan_only.py::test_daemon_plan_feedback_is_non_authorizing_and_execution_free",
              "tests/test_sentientosd_runtime_closure.py::test_maintenance_tick_orders_campaign_signal_world_state_and_cognition",
              "tests/test_repository_mutation_custody_regression.py::test_runtime_handoff_emission_external_root_no_state_change_or_repo_dirty",
              "tests/test_privileged_audit_verification.py::test_privileged_audit_wrapper_rejects_non_root_before_running_checks",
              "tests/test_privileged_audit_verification.py::test_required_quality_gate_binds_root_audits_to_exact_checkout",
              "tests/test_privileged_audit_verification.py::test_root_audit_result_is_uploaded_with_quality_gate_evidence",
              "sentientos/tests/test_work_plan_cli.py::test_cli_execution_uses_current_integrity_pressure_to_bound_mutation",
          ]
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": os.environ["GITHUB_SHA"],
              "test_provenance_path": "glow/test_runs/canonical_planning_provenance.json",
              "required_nodes": [
                  {"node_id": node, "rationale": "canonical planning and execution separation regression"}
                  for node in nodes
              ],
              "successful_path_nodes": nodes,
          }
          Path("glow/test_runs/canonical_planning_acceptance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYCODE
          python -m scripts.verify_task_acceptance \
            --manifest glow/test_runs/canonical_planning_acceptance.json \
            --provenance glow/test_runs/canonical_planning_provenance.json \
            --output glow/test_runs/canonical_planning_acceptance_result.json
      - name: Verify Federation Health freshness, bounded snapshot coverage, timestamps, and arithmetic
        run: |
          python -m scripts.run_tests -- -m "legacy or no_legacy_skip" -q \
            tests/test_federation_health_badge.py::test_compute_health_marks_snapshot_stale_when_latest_event_predates_window \
            tests/test_federation_health_badge.py::test_compute_health_does_not_treat_unknown_timestamp_offset_as_utc \
            tests/test_federation_health_badge.py::test_compute_health_handles_positive_window_beyond_timedelta_range \
            tests/test_federation_health_badge.py::test_compute_health_bounds_total_snapshot_and_reports_omitted_prefix \
            tests/test_federation_health_badge.py::test_compute_health_skips_ambiguous_or_resource_heavy_json_lines \
            tests/test_federation_health_badge.py::test_compute_health_accounts_for_malformed_records_not_valid_offschema_rows \
            tests/test_github_hosted_acceptance_workflows.py::test_federation_health_update_uses_hosted_administrator_and_narrow_commit_scope \
            tests/test_github_hosted_acceptance_workflows.py::test_source_validation_runs_federation_health_freshness_regression
          cp glow/test_runs/test_run_provenance.json \
            glow/test_runs/federation_health_provenance.json
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          node = "tests/test_federation_health_badge.py::test_compute_health_marks_snapshot_stale_when_latest_event_predates_window"
          parser_node = "tests/test_federation_health_badge.py::test_compute_health_skips_ambiguous_or_resource_heavy_json_lines"
          malformed_node = "tests/test_federation_health_badge.py::test_compute_health_accounts_for_malformed_records_not_valid_offschema_rows"
          timestamp_node = "tests/test_federation_health_badge.py::test_compute_health_does_not_treat_unknown_timestamp_offset_as_utc"
          window_node = "tests/test_federation_health_badge.py::test_compute_health_handles_positive_window_beyond_timedelta_range"
          coverage_node = "tests/test_federation_health_badge.py::test_compute_health_bounds_total_snapshot_and_reports_omitted_prefix"
          publisher_node = "tests/test_github_hosted_acceptance_workflows.py::test_federation_health_update_uses_hosted_administrator_and_narrow_commit_scope"
          contract_node = "tests/test_github_hosted_acceptance_workflows.py::test_source_validation_runs_federation_health_freshness_regression"
          nodes = [node, parser_node, malformed_node, timestamp_node, window_node, coverage_node, publisher_node, contract_node]
          manifest = {
              "schema_version": "sentientos.task_acceptance:v1",
              "task_classification": "behavior_adding",
              "repository_sha": os.environ["GITHUB_SHA"],
              "test_provenance_path": "glow/test_runs/federation_health_provenance.json",
              "required_nodes": [
                  {"node_id": node, "rationale": "stale local snapshots must not be reported as quiet health"},
                  {"node_id": parser_node, "rationale": "ambiguous and resource-heavy local JSONL records must be skipped without losing later valid observations"},
                  {"node_id": malformed_node, "rationale": "malformed UTF-8/JSON rows must be counted without counting valid out-of-schema JSON rows as malformed"},
                  {"node_id": timestamp_node, "rationale": "an RFC 3339 unknown offset must not be interpreted as UTC freshness"},
                  {"node_id": window_node, "rationale": "a very large positive history window must include representable timestamps without timedelta overflow"},
                  {"node_id": coverage_node, "rationale": "the local log scan must be byte-bounded and report omitted prefix and overlong-record evidence"},
                  {"node_id": publisher_node, "rationale": "the hosted App token publisher must use its non-deprecated client identifier input with narrow permissions"},
                  {"node_id": contract_node, "rationale": "CI must bind the Federation Health source contract to source-validation acceptance"},
              ],
              "successful_path_nodes": nodes,
          }
          Path("glow/test_runs/federation_health_acceptance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PYCODE
          python -m scripts.verify_task_acceptance \
            --manifest glow/test_runs/federation_health_acceptance.json \
            --provenance glow/test_runs/federation_health_provenance.json \
            --output glow/test_runs/federation_health_acceptance_result.json

      - name: Verify Federation stream relay JSON strictness
        run: |
          python -m scripts.run_tests -- -m "legacy or no_legacy_skip" -q \
            tests/test_federation_stream_relay.py \
            tests/test_github_hosted_acceptance_workflows.py::test_source_validation_runs_federation_relay_json_regressions
