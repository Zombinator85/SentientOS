            glow/test_runs/daemon_campaign_report_inspection_acceptance_result.json
            glow/test_runs/federation_stream_relay_provenance.json
            glow/test_runs/federation_stream_relay_acceptance.json
            glow/test_runs/federation_stream_relay_acceptance_result.json
            glow/test_runs/federation_replay_snapshot_provenance.json
            glow/test_runs/federation_replay_snapshot_acceptance.json
            glow/test_runs/federation_replay_snapshot_acceptance_result.json
            glow/test_runs/federation_peer_replay_owner_provenance.json
            glow/test_runs/federation_peer_replay_owner_acceptance.json
            glow/test_runs/federation_peer_replay_owner_acceptance_result.json
            glow/test_runs/federation_peer_health_bridge_provenance.json
            glow/test_runs/federation_peer_health_bridge_acceptance.json
            glow/test_runs/federation_peer_health_bridge_acceptance_result.json
            glow/test_runs/federation_peer_health_recovery_provenance.json
            glow/test_runs/federation_peer_health_recovery_acceptance.json
            glow/test_runs/federation_peer_health_recovery_acceptance_result.json
            glow/test_runs/federation_health_provenance.json
            glow/test_runs/federation_health_acceptance.json
            glow/test_runs/federation_health_acceptance_result.json
          if-no-files-found: ignore

  self-check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    services:
      docker:
        image: docker:dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375
    env:
      SENTIENTOS_HEADLESS: "1"
      SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/self-check-governor
      SENTIENTOS_FEDERATION_ROOT: .ci-runtime/self-check-federation
      SENTIENTOS_AUDIT_RUNTIME_DIR: /tmp/sentientos-self-check-audit-runtime
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: docker-build-cache-${{ github.sha }}
          restore-keys: |
            docker-build-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mark current test-run provenance cutoff
        run: touch "$RUNNER_TEMP/sentientos-test-run-started"

      - name: Install canonical test airlock
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-codex.txt
          python -m pip install --no-deps -e .
      - run: python -m scripts.lock check

      # ci_self_check.py performs privilege-gated repair and installation.
      # The equivalent read-only/static checks and full test suite run below.

      - uses: actions/cache@v3
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml', 'mypy.ini') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - run: pip install -e .[dev]

      - name: Build wheel
        run: python -m build --wheel

      - name: Pre-commit
        run: |
          pre-commit run --all-files || {
            git status --short
            exit 1
          }
        env:
          SENTIENTOS_TEST_RUN_DIR: /tmp/sentientos-precommit-test-runs
          SENTIENTOS_AUDIT_RUNTIME_DIR: /tmp/sentientos-precommit-audit-runtime
          SENTIENTOS_GOVERNOR_ROOT: /tmp/sentientos-precommit-governor
          SENTIENTOS_FEDERATION_ROOT: /tmp/sentientos-precommit-federation
          SENTIENTOS_CONTROL_KERNEL_ROOT: /tmp/sentientos-precommit-control-plane
          SENTIENTOS_RUNTIME_STATE_ROOT: .ci-runtime/precommit-runtime
          SENTIENTOS_DATA_DIR: /tmp/sentientos-precommit-data
          SENTIENTOS_HEARTBEAT_PATH: /tmp/sentientos-precommit-heartbeat.snap

      - name: Privilege lint
        run: python -m privilege_lint_cli --read-only --quiet .

      - name: Invariant lint
        run: python scripts/invariant_lint.py

      - name: Governance drift check
        run: python scripts/check_governance_drift.py

      - name: Audit sanity (blessed module entrypoints)
        run: |
          mkdir -p glow/audits
          # Manifest generation is bound to the canonical vow path by the mutation router.
          python -m scripts.generate_immutable_manifest
          python -m scripts.audit_immutability_verifier || true
          python -m scripts.verify_audits logs/ || true
          python -m scripts.plan_audit_repairs logs/ || true
          python -m scripts.converge_audits logs/ --max-iterations 5 --no-apply || true
          if [ -f glow/audits/baseline/audit_baseline.json ]; then
            python -m scripts.detect_audit_drift logs/
          else
            echo "[audit-sanity] baseline not found; skipping drift detection"
          fi
          if [ -f glow/pulse/baseline/pulse_schema_baseline.json ]; then
            python -m scripts.detect_pulse_schema_drift
          else
            echo "[audit-sanity] pulse baseline not found; skipping pulse drift detection"
          fi
          if [ -f glow/perception/baseline/perception_schema_baseline.json ]; then
            python -m scripts.detect_perception_schema_drift
          else
            echo "[audit-sanity] perception baseline not found; skipping perception drift detection"
          fi
          if [ -f glow/self/baseline/self_model_baseline.json ]; then
            python -m scripts.detect_self_model_drift
          else
            echo "[audit-sanity] self-model baseline not found; skipping self-model drift detection"
          fi
          if [ -f glow/federation/baseline/federation_identity_baseline.json ]; then
            python -m scripts.detect_federation_identity_drift
          else
            echo "[audit-sanity] federation identity baseline not found; skipping federation identity drift detection"
          fi
          python - <<'PYCODE'
          import json
          import os
          import sys
          from pathlib import Path

          should_fail = os.getenv("SENTIENTOS_CI_FAIL_ON_AUDIT_FAILURE") == "1"
          fail_on_unclean = os.getenv("SENTIENTOS_CI_FAIL_ON_AUDIT_UNCLEAN") == "1"
          gate_fail = False
          for name in ["audit_immutability_result.json", "verify_audits_result.json"]:
              path = Path("glow/audits") / name
              if not path.exists():
                  print(f"[audit-sanity] missing artifact: {path}")
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"[audit-sanity] unreadable artifact: {path} ({exc})")
                  continue
              ok = bool(payload.get("ok", False))
              tool = payload.get("tool", name)
              print(f"[audit-sanity] {tool} ok={ok}")
              if should_fail and not ok:
                  gate_fail = True
          convergence_path = Path("glow/audits/audit_convergence_report.json")
          if convergence_path.exists():
              try:
                  convergence = json.loads(convergence_path.read_text(encoding="utf-8"))
                  print(f"[audit-sanity] converge_audits ok={bool(convergence.get('ok', False))}")
                  if fail_on_unclean and (not convergence.get("ok", False)) and convergence.get("no_safe_repairs_remaining", False):
                      gate_fail = True
              except Exception as exc:
                  print(f"[audit-sanity] unreadable artifact: {convergence_path} ({exc})")
          else:
              print(f"[audit-sanity] missing artifact: {convergence_path}")

          if should_fail and gate_fail:
              sys.exit(1)
          if fail_on_unclean and gate_fail:
              sys.exit(1)
          PYCODE
        env:
          LUMOS_AUTO_APPROVE: '1'

      - name: Start Docker services
        run: docker compose --project-name sentientos-ci up --build -d

      - name: Wait for service health
        run: |
          services=(relay bridge1 bridge2 bridge3)
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            healthy=1
            for service in "${services[@]}"; do
              container_id="$(docker compose --project-name sentientos-ci ps -q "$service")"
              if [ -z "$container_id" ]; then
                healthy=0
                break
              fi
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing-healthcheck{{end}}' "$container_id" 2>/dev/null || true)"
              if [ "$status" != "healthy" ]; then
                healthy=0
                break
              fi
            done
            ngrok_id="$(docker compose --project-name sentientos-ci ps --all -q ngrok)"
            if [ -z "$ngrok_id" ]; then
              healthy=0
            else
              ngrok_status="$(docker inspect --format '{{.State.Status}}' "$ngrok_id" 2>/dev/null || true)"
              ngrok_exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$ngrok_id" 2>/dev/null || true)"
              if [ "$ngrok_status" != "exited" ] || [ "$ngrok_exit_code" != "0" ]; then
                healthy=0
              fi
            fi
            if [ "$healthy" -eq 1 ]; then
              docker compose --project-name sentientos-ci ps
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name sentientos-ci ps
          docker compose --project-name sentientos-ci logs --no-color --tail=50
          exit 1

      - name: Mypy baseline ratchet
        run: python scripts/check_mypy_baseline.py

      - name: Test dependency airlock (collect-only)
        run: python -m scripts.run_tests -q --collect-only
        env:
          SENTIENTOS_ALLOW_NONEXECUTION_TEST_RUN: "1"

      - name: Strategic signature verify fixture (hmac-test)
        run: |
          rm -rf /tmp/strategic-sign-ci
          mkdir -p /tmp/strategic-sign-ci
          python - <<'PYCODE'
          import json
          from pathlib import Path

          from sentientos.signed_strategic import sign_object

          root = Path('/tmp/strategic-sign-ci')
          payload = {
              'schema_version': 2,
              'proposal_id': 'ci-proposal-1',
              'created_at': '2099-01-01T00:00:00Z',
              'approval': {'status': 'proposed'},
          }
          proposal_path = root / 'glow/forge/strategic/proposals/proposal_ci_1.json'
          proposal_path.parent.mkdir(parents=True, exist_ok=True)
          proposal_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          sign_object(
              root,
              kind='proposal',
              object_id='ci-proposal-1',
              object_rel_path=str(proposal_path.relative_to(root)),
              object_payload=payload,
              created_at='2099-01-01T00:00:00Z',
          )
          PYCODE
          python scripts/verify_strategic_signatures.py --repo-root /tmp/strategic-sign-ci --last 10
        env:
          SENTIENTOS_STRATEGIC_SIGNING: "hmac-test"
          SENTIENTOS_STRATEGIC_HMAC_SECRET: "ci-secret"

      - name: Attestation snapshot verify fixture (hmac-test)
        run: |
          rm -rf /tmp/attestation-snapshot-ci
          mkdir -p /tmp/attestation-snapshot-ci
          python - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path

          from sentientos.attestation_snapshot import AttestationSnapshot, emit_snapshot, maybe_sign_snapshot

          root = Path('/tmp/attestation-snapshot-ci')
          payload = AttestationSnapshot(
              schema_version=1,
              ts='2099-01-01T00:00:00Z',
              policy_hash='policy-ci',
              integrity_status_hash='integrity-ci',
              latest_rollup_sig_hash=None,
              latest_strategic_sig_hash=None,
              latest_goal_graph_hash='goal-ci',
              latest_catalog_checkpoint_hash=None,
              doctrine_bundle_sha256='bundle-ci',
              witness_summary={'rollup': {'status': 'disabled'}, 'strategic': {'status': 'disabled'}},
          )
          rel = emit_snapshot(root, payload)
          maybe_sign_snapshot(root, snapshot_rel_path=rel, snapshot_payload=payload.to_dict())
          PYCODE
          python scripts/verify_attestation_snapshots.py --repo-root /tmp/attestation-snapshot-ci --last 10
        env:
          SENTIENTOS_ATTESTATION_SNAPSHOT_SIGNING: "hmac-test"
          SENTIENTOS_ATTESTATION_SNAPSHOT_HMAC_SECRET: "ci-secret"
          SENTIENTOS_ATTESTATION_SNAPSHOT_VERIFY: "1"

      - name: Pytest with coverage
        run: python -m scripts.run_tests
        env:
          SENTIENTOS_CI_REQUIRE_DEFAULT_INTENT: "1"
          SENTIENTOS_CI_MIN_PASSED: "1"
          SENTIENTOS_CI_MAX_SKIP_RATE: "0.20"
          SENTIENTOS_CI_MAX_XFAIL_RATE: "0.10"

      - name: Analyze test provenance trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain

      - name: Analyze router telemetry trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain --output glow/test_runs/router_telemetry_report.json

      - name: Generate forensic run report
        if: always()
        run: |
          if [ "${SENTIENTOS_CI_FAIL_ON_FORENSIC_INTEGRITY:-0}" = "1" ]; then
            python scripts/forensic_run_report.py --fail-on-integrity
          else
            python scripts/forensic_run_report.py
          fi

      - name: Vow manifest preflight
        if: always()
        run: python -m scripts.generate_immutable_manifest || true

      - name: Audit immutability preflight
        if: always()
        run: python -m scripts.audit_immutability_verifier || true

      - name: Contract drift rollup
        if: always()
        run: python -m scripts.contract_drift || true

      - name: Emit contract status rollup
        if: always()
        run: python -m scripts.emit_contract_status || true

      - name: Protected mutation proof summary (informational)
        if: always()
        run: python scripts/verify_kernel_admission_provenance.py --summary-only || true


      - name: Emit doctrine contract bundle
        if: always()
        run: |
          mkdir -p glow/contracts
          if make forge-ci; then
            echo "protected_forge_ci=passed"
          else
            forge_ci_status=$?
            echo "::warning::protected Forge CI failed or was not authorized on this runner (exit ${forge_ci_status}); bundle generation continues with failure recorded"
          fi
          python -m scripts.emit_contract_status
          python -m scripts.emit_stability_doctrine
          python -m scripts.emit_ci_baseline
          python -m scripts.emit_forge_progress_contract || true
          python - <<'PYCODE'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "sha": os.getenv("GITHUB_SHA", ""),
              "run_id": int(os.getenv("GITHUB_RUN_ID", "0") or "0"),
              "repository": os.getenv("GITHUB_REPOSITORY", ""),
              "created_at": datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path("glow/contracts/artifact_metadata.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYCODE
          python -m scripts.emit_contract_manifest --contract-dir glow/contracts --git-sha "${GITHUB_SHA}"

      - name: Upload doctrine contract bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentientos-contracts-${{ github.sha }}
          path: |
            glow/contracts/contract_status.json
            glow/contracts/protected_mutation_proof_status.json
            glow/contracts/stability_doctrine.json
            glow/contracts/ci_baseline.json
            glow/contracts/forge_progress_baseline.json
            glow/contracts/artifact_metadata.json
            glow/contracts/contract_manifest.json
          if-no-files-found: error


      - name: Optional mirror doctrine contract bundle to release asset
        if: always() && env.SENTIENTOS_CONTRACT_MIRROR == '1'
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI missing; skipping mirror upload"
            exit 0
          fi
          mkdir -p glow/contracts
          zip -j "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip"             glow/contracts/contract_status.json             glow/contracts/protected_mutation_proof_status.json             glow/contracts/stability_doctrine.json             glow/contracts/ci_baseline.json             glow/contracts/forge_progress_baseline.json             glow/contracts/artifact_metadata.json             glow/contracts/contract_manifest.json || true
          if gh release view "contracts-${GITHUB_SHA}" >/dev/null 2>&1; then
            gh release upload "contracts-${GITHUB_SHA}" "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip" --clobber
          else
            gh release create "contracts-${GITHUB_SHA}" "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip" --title "Contracts ${GITHUB_SHA}" --notes "Mirror doctrine bundle ${GITHUB_SHA}"
          fi

      - name: Optional CI baseline contract gate
        if: always() && env.SENTIENTOS_CI_CI_BASELINE == '1'
        run: |
          python -m scripts.run_tests -q
          python -m scripts.emit_ci_baseline
          python -m scripts.emit_contract_status


      - name: Upload test run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_run_provenance_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/test_runs/test_run_provenance.json
            glow/test_runs/provenance/*.json

      - name: Stage current test-run artifacts
        if: always()
        run: >-
          python scripts/stage_current_test_artifacts.py
          --repo-root .
          --output-dir "$RUNNER_TEMP/sentientos-test-artifacts"
          --expected-repository-sha "$GITHUB_SHA"
          --started-after "$RUNNER_TEMP/sentientos-test-run-started"
      - name: Upload test failure digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_failure_digest_${{ github.run_id }}_${{ github.job }}
          path: |
            ${{ runner.temp }}/sentientos-test-artifacts/*
          if-no-files-found: ignore

      - name: Upload test trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_trend_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/test_trend_report.json

      - name: Upload router telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router_telemetry_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/router_telemetry_report.json

      - name: Upload forensic run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic_run_report_${{ github.run_id }}_${{ github.job }}
          path: glow/reports/forensic_report_*.json
          if-no-files-found: ignore

      - name: Upload audit sanity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit_sanity_${{ github.run_id }}_${{ github.job }}
          path: glow/audits/*.json
          if-no-files-found: ignore

      - name: Upload contract status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract_status_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/contracts/contract_status.json
            glow/contracts/stability_doctrine.json
            glow/contracts/ci_baseline.json
            glow/contracts/forge_progress_baseline.json
            glow/contracts/artifact_metadata.json
            glow/contracts/contract_manifest.json
            glow/contracts/mypy_baseline.json
          if-no-files-found: ignore

      - name: Install FFmpeg for demo export
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          mirror_switched=false
          switch_to_public_archive() {
            local mirror_list=/etc/apt/apt-mirrors.txt
            local switched=false
            if sudo test -f "$mirror_list"; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$mirror_list"
              if sudo grep -qF 'archive.ubuntu.com' "$mirror_list"; then
                switched=true
              fi
            fi
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
            if sudo grep -Rqs 'azure.archive.ubuntu.com' /etc/apt; then
              echo "::error::Azure Ubuntu mirror remains configured after fallback rewrite."
              return 1
            fi
            if [[ "$switched" != true ]] && ! sudo grep -Rqs 'archive.ubuntu.com' /etc/apt; then
              echo "::error::No public Ubuntu archive source was configured by fallback."
              return 1
            fi
            mirror_switched=true
          }
          if ! sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" update; then
            echo "::warning::Ubuntu package index refresh timed out; switching the runner to archive.ubuntu.com."
            switch_to_public_archive
            sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" update
          fi
          if ! sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" install \
            --no-install-recommends -y ffmpeg; then
            echo "::warning::FFmpeg package download or install timed out; retrying after refreshing the public Ubuntu archive."
            if [[ "$mirror_switched" != true ]]; then
              switch_to_public_archive
            fi
            sudo timeout --kill-after=10s 180s apt-get "${apt_options[@]}" update
            sudo timeout --kill-after=10s 300s apt-get "${apt_options[@]}" install \
              --no-install-recommends -y ffmpeg
          fi
      - name: Run parliament demo
        run: |
          mkdir -p demos
          sudo -E env SENTIENTOS_HEADLESS=1 LUMOS_AUTO_APPROVE=1 "$(command -v python)" -m scripts.demo_parliament
          ls -t demos/*.mp4 | tail -n +4 | xargs -r rm --

      - name: Upload demos
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demos/*.mp4

      - name: Remove old demo artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! artifact_ids=$(gh api --method GET repos/${{ github.repository }}/actions/artifacts -f name=demo -F per_page=100 -q '.artifacts | sort_by(.created_at) | reverse | map(select(.name=="demo")) | .[3:] | .[].id'); then
            echo "::warning::Could not list old demo artifacts; skipping cleanup."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if ! gh api repos/${{ github.repository }}/actions/artifacts/"$artifact_id" -X DELETE >/dev/null; then
              echo "::warning::Could not delete demo artifact $artifact_id; continuing cleanup."
            fi
          done <<< "$artifact_ids"

  docs:
    runs-on: ubuntu-latest
    env:
      SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/docs-governor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation toolchain
        run: python -m pip install -e ".[docs]"

      - run: make docs
      - run: sphinx-build -b linkcheck -W docs docs/_build/linkcheck
  helm-k8s-test:
    runs-on: ubuntu-latest
    env:
      SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/helm-governor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl
      - name: Install Helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Install canonical test airlock
        run: |
          python -m pip install --no-deps -e .
          python -m pip install --only-binary=:all: -r requirements-codex.txt
      - name: Run helm integration test
        run: python -m scripts.run_tests tests/integration/helm_k8s_test.py

      - name: Analyze test provenance trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain

      - name: Analyze router telemetry trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain --output glow/test_runs/router_telemetry_report.json

      - name: Generate forensic run report
        if: always()
        run: |
          if [ "${SENTIENTOS_CI_FAIL_ON_FORENSIC_INTEGRITY:-0}" = "1" ]; then
            python scripts/forensic_run_report.py --fail-on-integrity
          else
            python scripts/forensic_run_report.py
          fi

      - name: Vow manifest preflight
        if: always()
        run: python -m scripts.generate_immutable_manifest || true

      - name: Audit immutability preflight
        if: always()
        run: python -m scripts.audit_immutability_verifier || true

      - name: Contract drift rollup
        if: always()
        run: python -m scripts.contract_drift || true

      - name: Emit contract status rollup
        if: always()
        run: python -m scripts.emit_contract_status || true

      - name: Protected mutation proof summary (informational)
        if: always()
        run: python scripts/verify_kernel_admission_provenance.py --summary-only || true


      - name: Emit doctrine contract bundle
        if: always()
        run: |
          mkdir -p glow/contracts
          if make forge-ci; then
            echo "protected_forge_ci=passed"
          else
            forge_ci_status=$?
            echo "::warning::protected Forge CI failed or was not authorized on this runner (exit ${forge_ci_status}); bundle generation continues with failure recorded"
          fi
          python -m scripts.emit_contract_status
          python -m scripts.emit_stability_doctrine
          python -m scripts.emit_ci_baseline
          python -m scripts.emit_forge_progress_contract || true
          python - <<'PYCODE'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "sha": os.getenv("GITHUB_SHA", ""),
              "run_id": int(os.getenv("GITHUB_RUN_ID", "0") or "0"),
              "repository": os.getenv("GITHUB_REPOSITORY", ""),
              "created_at": datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path("glow/contracts/artifact_metadata.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYCODE
          python -m scripts.emit_contract_manifest --contract-dir glow/contracts --git-sha "${GITHUB_SHA}"

      - name: Upload doctrine contract bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentientos-contracts-${{ github.sha }}
          path: |
            glow/contracts/contract_status.json
            glow/contracts/protected_mutation_proof_status.json
            glow/contracts/stability_doctrine.json
            glow/contracts/ci_baseline.json
            glow/contracts/forge_progress_baseline.json
            glow/contracts/artifact_metadata.json
            glow/contracts/contract_manifest.json
          if-no-files-found: error


      - name: Optional mirror doctrine contract bundle to release asset
        if: always() && env.SENTIENTOS_CONTRACT_MIRROR == '1'
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI missing; skipping mirror upload"
            exit 0
          fi
          mkdir -p glow/contracts
          zip -j "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip"             glow/contracts/contract_status.json             glow/contracts/protected_mutation_proof_status.json             glow/contracts/stability_doctrine.json             glow/contracts/ci_baseline.json             glow/contracts/forge_progress_baseline.json             glow/contracts/artifact_metadata.json             glow/contracts/contract_manifest.json || true
          if gh release view "contracts-${GITHUB_SHA}" >/dev/null 2>&1; then
            gh release upload "contracts-${GITHUB_SHA}" "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip" --clobber
          else
            gh release create "contracts-${GITHUB_SHA}" "glow/contracts/sentientos-contracts-${GITHUB_SHA}.zip" --title "Contracts ${GITHUB_SHA}" --notes "Mirror doctrine bundle ${GITHUB_SHA}"
          fi

      - name: Optional CI baseline contract gate
        if: always() && env.SENTIENTOS_CI_CI_BASELINE == '1'
        run: |
          python -m scripts.run_tests -q
          python -m scripts.emit_ci_baseline
          python -m scripts.emit_contract_status


      - name: Upload test run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_run_provenance_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/test_runs/test_run_provenance.json
            glow/test_runs/provenance/*.json

      - name: Upload test trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_trend_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/test_trend_report.json

      - name: Upload router telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router_telemetry_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/router_telemetry_report.json

      - name: Upload forensic run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic_run_report_${{ github.run_id }}_${{ github.job }}
          path: glow/reports/forensic_report_*.json
          if-no-files-found: ignore

      - name: Upload audit sanity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit_sanity_${{ github.run_id }}_${{ github.job }}
          path: glow/audits/*.json
          if-no-files-found: ignore

      - name: Upload contract status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract_status_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/contracts/contract_status.json
            glow/contracts/stability_doctrine.json
            glow/contracts/ci_baseline.json
            glow/contracts/forge_progress_baseline.json
            glow/contracts/artifact_metadata.json
            glow/contracts/contract_manifest.json
            glow/contracts/mypy_baseline.json
          if-no-files-found: ignore
