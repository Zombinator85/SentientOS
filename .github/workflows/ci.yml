      - name: Verify Federation replay snapshot path confinement
        run: |
          python -m scripts.run_tests -- -m "legacy or no_legacy_skip" -q \
            tests/test_federation_poller.py::test_persist_replay_snapshot_rejects_path_traversal \
            tests/test_federation_poller.py::test_persist_replay_snapshot_keeps_safe_peer_name \
