name: Lint Benchmark
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SENTIENTOS_HEADLESS: "1"
      SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/lint-governor
      SENTIENTOS_FEDERATION_ROOT: .ci-runtime/lint-federation
    strategy:
      matrix:
        include:
          - mode: core
            python-version: '3.11'
          - mode: bin-lock
            python-version: '3.14'
          - mode: src-lock-full
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.mode == 'src-lock-full'
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - if: matrix.mode == 'src-lock-full'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - if: matrix.mode == 'core'
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .[dev]
      - if: matrix.mode == 'bin-lock'
        run: |
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt
          pip install -e .[dev]
      - if: matrix.mode == 'src-lock-full'
        run: |
          pip install -r requirements-src-lock.txt
          pip install --only-binary=:all: -r requirements-codex.txt
          pip install -r requirements-dev.txt
          pip install -e .[dev]
      - name: privilege_lint
        run: python -m privilege_lint_cli --read-only --quiet .
      - name: audit_verify
        run: python -m scripts.check_audit_chain
      - name: mypy
        run: python scripts/check_mypy_baseline.py
      - name: pytest airlock guard
        run: python scripts/pytest_airlock_guard.py
      - name: FastAPI TestClient regression set
        if: matrix.mode == 'core'
        timeout-minutes: 5
        run: |
          python -m scripts.run_tests -q \
            tests/test_dashboard_api.py \
            tests/test_dashboard_drift_api.py \
            tests/test_dashboard_pressure_api.py \
            tests/test_dashboard_sse_reconnect_smoke.py \
            tests/test_chat_service_lazy_loading.py \
            tests/test_admin_status_endpoints.py \
            tests/test_federation_stream.py \
            tests/integration/test_fastapi_relay.py
      - name: pytest
        run: python -m scripts.run_tests
        env:
          SENTIENTOS_CI_REQUIRE_DEFAULT_INTENT: "1"
          SENTIENTOS_CI_MIN_PASSED: "1"
          SENTIENTOS_CI_MAX_SKIP_RATE: "0.20"
          SENTIENTOS_CI_MAX_XFAIL_RATE: "0.10"
      - name: Analyze test provenance trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain

      - name: Analyze router telemetry trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain --output glow/test_runs/router_telemetry_report.json

      - name: Upload test run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_run_provenance_${{ github.run_id }}_${{ github.job }}_${{ matrix.mode }}
          path: |
            glow/test_runs/test_run_provenance.json
            glow/test_runs/provenance/*.json

      - name: Upload test failure digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_failure_digest_${{ github.run_id }}_${{ github.job }}_${{ matrix.mode }}
          path: |
            glow/test_runs/test_failure_digest.json
            glow/test_runs/pytest_junitxml*.xml
          if-no-files-found: ignore

      - name: Upload test trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_trend_report_${{ github.run_id }}_${{ github.job }}_${{ matrix.mode }}
          path: glow/test_runs/test_trend_report.json

      - name: Upload router telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router_telemetry_report_${{ github.run_id }}_${{ github.job }}_${{ matrix.mode }}
          path: glow/test_runs/router_telemetry_report.json
      - name: Env report
        run: plint-env report --json > env.json
      - uses: actions/upload-artifact@v4
        with:
          name: env_${{ matrix.mode }}.json
          path: env.json
      - name: Fail on JS/Go skips
        if: matrix.mode == 'src-lock-full'
        run: |
          if grep -q 'requires_node' <<< "${{ steps.tests.outputs.stdout }}"; then
            echo 'node tests skipped'; exit 1; fi
          if grep -q 'requires_go' <<< "${{ steps.tests.outputs.stdout }}"; then
            echo 'go tests skipped'; exit 1; fi
