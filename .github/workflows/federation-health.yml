name: Federation Health Update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publication_fixture:
        description: "Create and automatically close a labeled test PR for the publisher path"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - automation/federation-health-publication-fixture
    paths:
      - ".github/workflows/federation-health.yml"
      - "federation_health_badge.py"
      - "work/federation_health_publication_fixture_request.txt"

permissions:
  contents: read

jobs:
  health:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publication_fixture != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Update federation health with Administrator authority
        run: |
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python federation_health_badge.py
      - name: Bind the report to this successful execution
        env:
          FEDERATION_HEALTH_RUN_ID: ${{ github.run_id }}
          FEDERATION_HEALTH_RUN_ATTEMPT: ${{ github.run_attempt }}
          FEDERATION_HEALTH_EVENT_NAME: ${{ github.event_name }}
          FEDERATION_HEALTH_REF: ${{ github.ref }}
          FEDERATION_HEALTH_HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/federation_health_execution_receipt.py \
            --report docs/FEDERATION_HEALTH.md \
            --output docs/FEDERATION_HEALTH_EXECUTION.json
      - uses: actions/upload-artifact@v4
        with:
          name: federation-health-${{ github.run_id }}
          path: |
            docs/FEDERATION_HEALTH.md
            docs/FEDERATION_HEALTH_EXECUTION.json
          if-no-files-found: error

  fixture:
    if: ${{ (inputs.publication_fixture == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact disposable branch request
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          branch = "refs/heads/automation/federation-health-publication-fixture"
          request = Path("work/federation_health_publication_fixture_request.txt")
          expected = "sentientos.federation_health_publication_fixture_request:v1\nTEST FIXTURE ONLY — NOT TELEMETRY.\n"
          if __import__("os").environ.get("GITHUB_REF") != branch:
              raise SystemExit("fixture_request_branch_mismatch")
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          if changed != [str(request)]:
              raise SystemExit("fixture_request_commit_must_change_only_sentinel")
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          main = subprocess.check_output(
              ["git", "ls-remote", "origin", "refs/heads/main"], text=True
          ).split()[0]
          if parent != main:
              raise SystemExit("fixture_request_parent_must_be_current_main")
          if request.read_text(encoding="utf-8") != expected:
              raise SystemExit("fixture_request_marker_invalid")
          PY
      - name: Generate an explicitly labeled publication test fixture
        run: |
          cat > docs/FEDERATION_HEALTH.md <<EOF
          # Federation Health

          > TEST FIXTURE — NOT TELEMETRY. This report tests PR publication only and must never be merged.

          - Workflow run: ${GITHUB_RUN_ID}
          - Status: publication-path-test
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: federation-health-${{ github.run_id }}
          path: docs/FEDERATION_HEALTH.md
          if-no-files-found: error

  publish:
    needs: [health, fixture]
    if: >-
      ${{ always() && (
        (needs.health.result == 'success' && github.ref == 'refs/heads/main') ||
        (needs.fixture.result == 'success' && (
          (inputs.publication_fixture == true && github.ref == 'refs/heads/main') ||
          github.ref == 'refs/heads/automation/federation-health-publication-fixture'
        ))
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: federation-health-${{ github.run_id }}
          path: docs
      - id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ (inputs.publication_fixture == true || github.ref == 'refs/heads/automation/federation-health-publication-fixture') && format('automation/federation-health-fixture-{0}', github.run_id) || 'automation/federation-health' }}
          delete-branch: false
          draft: ${{ (inputs.publication_fixture == true || github.ref == 'refs/heads/automation/federation-health-publication-fixture') && 'always-true' || 'false' }}
          commit-message: "${{ (inputs.publication_fixture == true || github.ref == 'refs/heads/automation/federation-health-publication-fixture') && 'test: verify federation health publisher fixture' || 'chore: update federation health' }}"
          title: "${{ (inputs.publication_fixture == true || github.ref == 'refs/heads/automation/federation-health-publication-fixture') && '[TEST FIXTURE] verify Federation Health publication path' || 'chore: update federation health' }}"
          body: "${{ (inputs.publication_fixture == true || github.ref == 'refs/heads/automation/federation-health-publication-fixture') && 'TEST FIXTURE — NOT TELEMETRY. The workflow independently verifies the exact one-file draft PR, then closes it and deletes its branch without merging.' || 'Automated Federation Health output generated after the hosted Administrator preflight.' }}"
          add-paths: |
            docs/FEDERATION_HEALTH.md
            ${{ (inputs.publication_fixture != true && !(github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture')) && 'docs/FEDERATION_HEALTH_EXECUTION.json' || '' }}
      - name: Verify the changed-output test PR
        id: verify-fixture
        if: ${{ inputs.publication_fixture == true || (github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          FIXTURE_BRANCH: automation/federation-health-fixture-${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GH_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          if not number:
              raise SystemExit("fixture_publication_pr_not_created")
          pr = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/pulls/{number}"], text=True))
          files = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/pulls/{number}/files?per_page=100"], text=True))
          patch = files[0].get("patch", "") if len(files) == 1 else ""
          passed = bool(
              pr.get("state") == "open"
              and pr.get("draft") is True
              and pr.get("merged") is False
              and pr.get("base", {}).get("ref") == "main"
              and pr.get("head", {}).get("ref") == os.environ["FIXTURE_BRANCH"]
              and len(files) == 1
              and files[0].get("filename") == "docs/FEDERATION_HEALTH.md"
              and "TEST FIXTURE" in patch
              and "NOT TELEMETRY" in patch)
          proof = {
              "schema_version": "sentientos.federation_health_fixture_publication:v1",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "repository": repository,
              "pull_request_number": pr["number"],
              "pull_request_url": pr["html_url"],
              "pull_request_head_sha": pr["head"]["sha"],
              "pull_request_base_sha": pr["base"]["sha"],
              "draft": pr.get("draft"),
              "changed_paths": [item["filename"] for item in files],
              "patch_sha256": hashlib.sha256(patch.encode()).hexdigest(),
              "test_fixture_only": True,
              "publication_scope_verified": passed,
              "cleanup": {"closed": False, "merged": False, "branch_deleted": False},
              "verified": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "federation-health-fixture-publication.json"
          path.write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(proof, sort_keys=True))
          if not passed:
              raise SystemExit("fixture_publication_pr_scope_or_marker_mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("verified=true\n")
          PY
      - name: Close any fixture PR and remove its branch without merging
        if: ${{ always() && (inputs.publication_fixture == true || (github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          FIXTURE_BRANCH: automation/federation-health-fixture-${{ github.run_id }}
          DELETE_TRIGGER_BRANCH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GH_REPOSITORY"]
          branch = os.environ["FIXTURE_BRANCH"]
          number = os.environ["PR_NUMBER"]
          owner = repository.split("/", 1)[0]
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "federation-health-fixture-publication.json"
          if proof_path.exists():
              proof = json.loads(proof_path.read_text(encoding="utf-8"))
          else:
              proof = {
                  "schema_version": "sentientos.federation_health_fixture_publication:v1",
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "repository": repository,
                  "test_fixture_only": True,
                  "publication_scope_verified": False,
                  "verified": False,
              }
          errors = []
          closed = False
          merged = False
          if not number:
              try:
                  matches = json.loads(subprocess.check_output([
                      "gh", "api", f"repos/{repository}/pulls?state=all&head={owner}:{branch}&per_page=100"],
                      text=True))
                  matching = [item for item in matches if item.get("head", {}).get("ref") == branch]
                  if len(matching) == 1:
                      number = str(matching[0]["number"])
                  elif len(matching) > 1:
                      errors.append("fixture_pr_discovery_ambiguous")
              except Exception as exc:
                  errors.append(f"fixture_pr_discovery_failed:{type(exc).__name__}:{str(exc)[:300]}")
          if number:
              try:
                  pr = json.loads(subprocess.check_output([
                      "gh", "api", f"repos/{repository}/pulls/{number}"], text=True))
                  same_branch = pr.get("head", {}).get("ref") == branch
                  same_repository = pr.get("head", {}).get("repo", {}).get("full_name") == repository
                  if not (same_branch and same_repository):
                      errors.append("fixture_pr_binding_mismatch")
                  else:
                      subprocess.run(["gh", "api", "--method", "PATCH",
                                      f"repos/{repository}/pulls/{number}", "-f", "state=closed"],
                                     check=True, capture_output=True, text=True)
                      pr = json.loads(subprocess.check_output([
                          "gh", "api", f"repos/{repository}/pulls/{number}"], text=True))
                      closed = pr.get("state") == "closed"
                      merged = pr.get("merged") is True or pr.get("merged_at") is not None
                      if not closed:
                          errors.append("fixture_pr_close_readback_failed")
                      if merged:
                          errors.append("fixture_pr_was_merged")
              except Exception as exc:
                  errors.append(f"fixture_pr_close_failed:{type(exc).__name__}:{str(exc)[:300]}")
          ref = f"repos/{repository}/git/ref/heads/{branch}"
          delete_ref = f"repos/{repository}/git/refs/heads/{branch}"
          try:
              lookup = subprocess.run(["gh", "api", ref], capture_output=True, text=True)
              if lookup.returncode == 0:
                  subprocess.run(["gh", "api", "--method", "DELETE", delete_ref],
                                 check=True, capture_output=True, text=True)
                  readback = subprocess.run(["gh", "api", ref], capture_output=True, text=True)
                  branch_deleted = (readback.returncode != 0 and
                                    ("HTTP 404" in readback.stderr or
                                     "Reference does not exist" in readback.stderr))
              elif "HTTP 404" in lookup.stderr or "Reference does not exist" in lookup.stderr:
                  branch_deleted = True
              else:
                  branch_deleted = False
                  errors.append(f"fixture_branch_lookup_failed:{lookup.stderr.strip()[:300]}")
              if not branch_deleted:
                  errors.append("fixture_branch_removal_readback_failed")
          except subprocess.CalledProcessError as exc:
              branch_deleted = False
              detail = (exc.stderr or exc.stdout or str(exc)).strip()[:300]
              errors.append(f"fixture_branch_cleanup_failed:exit={exc.returncode}:{detail}")
          except Exception as exc:
              branch_deleted = False
              errors.append(f"fixture_branch_cleanup_failed:{type(exc).__name__}:{str(exc)[:300]}")
          trigger_branch_deleted = True
          if os.environ.get("DELETE_TRIGGER_BRANCH") == "true":
              trigger_ref = (
                  f"repos/{repository}/git/ref/heads/"
                  "automation/federation-health-publication-fixture"
              )
              trigger_delete_ref = (
                  f"repos/{repository}/git/refs/heads/"
                  "automation/federation-health-publication-fixture"
              )
              try:
                  lookup = subprocess.run(["gh", "api", trigger_ref], capture_output=True, text=True)
                  if lookup.returncode == 0:
                      subprocess.run(["gh", "api", "--method", "DELETE", trigger_delete_ref],
                                     check=True, capture_output=True, text=True)
                      readback = subprocess.run(["gh", "api", trigger_ref], capture_output=True, text=True)
                      trigger_branch_deleted = (
                          readback.returncode != 0 and
                          ("HTTP 404" in readback.stderr or
                           "Reference does not exist" in readback.stderr)
                      )
                  elif "HTTP 404" in lookup.stderr or "Reference does not exist" in lookup.stderr:
                      trigger_branch_deleted = True
                  else:
                      trigger_branch_deleted = False
                      errors.append(f"fixture_trigger_branch_lookup_failed:{lookup.stderr.strip()[:300]}")
                  if not trigger_branch_deleted:
                      errors.append("fixture_trigger_branch_removal_readback_failed")
              except subprocess.CalledProcessError as exc:
                  trigger_branch_deleted = False
                  detail = (exc.stderr or exc.stdout or str(exc)).strip()[:300]
                  errors.append(f"fixture_trigger_branch_cleanup_failed:exit={exc.returncode}:{detail}")
              except Exception as exc:
                  trigger_branch_deleted = False
                  errors.append(f"fixture_trigger_branch_cleanup_failed:{type(exc).__name__}:{str(exc)[:300]}")
          proof["cleanup"] = {
              "closed": closed,
              "merged": merged,
              "branch_deleted": branch_deleted,
              "trigger_branch_deleted": trigger_branch_deleted,
          }
          proof["cleanup_errors"] = errors
          proof["verified"] = bool(
              proof.get("publication_scope_verified")
              and closed
              and not merged
              and branch_deleted
              and trigger_branch_deleted
          )
          proof_path.write_text(json.dumps(proof, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(proof, sort_keys=True))
          if not proof["verified"]:
              raise SystemExit("fixture_publication_cleanup_or_scope_unverified")
          PY
      - name: Upload changed-output publication proof
        if: ${{ always() && (inputs.publication_fixture == true || (github.event_name == 'push' && github.ref == 'refs/heads/automation/federation-health-publication-fixture')) }}
        uses: actions/upload-artifact@v4
        with:
          name: federation-health-publication-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/federation-health-fixture-publication.json
          if-no-files-found: error

