name: Federation Health Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Update federation health with Administrator authority
        run: |
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python federation_health_badge.py
      - uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: update federation health'
          add: 'docs/FEDERATION_HEALTH.md'
