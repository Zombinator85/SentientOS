name: Federation Health Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/federation-health.yml"
      - "federation_health_badge.py"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Update federation health with Administrator authority
        run: |
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python federation_health_badge.py
      - uses: actions/upload-artifact@v4
        with:
          name: federation-health-${{ github.run_id }}
          path: docs/FEDERATION_HEALTH.md
          if-no-files-found: error

  publish:
    needs: health
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: federation-health-${{ github.run_id }}
          path: docs
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/federation-health
          delete-branch: true
          commit-message: 'chore: update federation health'
          title: 'chore: update federation health'
          body: 'Automated Federation Health output generated after the hosted Administrator preflight.'
          add-paths: |
            docs/FEDERATION_HEALTH.md
