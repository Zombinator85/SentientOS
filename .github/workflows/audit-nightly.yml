name: Nightly Audit Integrity

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - name: Verify and auto repair logs
        id: repair
        run: |
          set +e
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.verify_audits logs/ --auto-repair --no-input 2>&1 \
            | tee "$RUNNER_TEMP/audit_output.txt"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git add -- logs
          if git diff --cached --quiet -- logs; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
          else
            echo "patched=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LUMOS_AUTO_APPROVE: '1'
        continue-on-error: true
      - name: Commit and push repairs
        if: steps.repair.outputs.patched == 'true'
        run: |
          branch="auto-repair/audit-${{ github.run_id }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add logs
          git commit -m "chore: auto repair audit logs"
          git push origin "$branch"
      - name: Open repair PR
        if: steps.repair.outputs.patched == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repository } = await github.rest.repos.get(context.repo);
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `auto-repair/audit-${{ github.run_id }}`,
              base: repository.default_branch,
              title: `auto-repair/audit-${{ github.run_id }}`,
              body: 'Automatic audit log repair',
            });
      - name: Fail if audit verification remains unsuccessful
        if: steps.repair.outputs.status != '0'
        run: |
          echo "Audit verification or repair did not complete successfully" >&2
          exit 1
