name: Nightly Audit Integrity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-nightly.yml"
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.initial.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Verify audits before repair
        id: initial
        run: |
          set +e
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.verify_audits logs/ --strict --no-input
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
        env:
          LUMOS_AUTO_APPROVE: '1'

  repair:
    needs: audit
    if: ${{ github.ref == 'refs/heads/main' && needs.audit.result == 'success' && needs.audit.outputs.status != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Plan and apply safe audit repairs
        env:
          LUMOS_AUTO_APPROVE: '1'
        run: |
          set -euo pipefail
          repair_dir="glow/audits/repair_runs/${GITHUB_RUN_ID}"
          mkdir -p "$repair_dir"
          plan="$repair_dir/plan.json"
          result="$repair_dir/result.json"
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.plan_audit_repairs logs/ --output "$plan"
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.apply_audit_repairs --plan "$plan" --output "$result" --apply
      - name: Verify audits after repair
        id: final
        env:
          LUMOS_AUTO_APPROVE: '1'
        run: |
          set +e
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.verify_audits logs/ --strict --no-input
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Stage append-only repair evidence
        id: stage
        if: always()
        run: |
          set -euo pipefail
          repair_dir="glow/audits/repair_runs/${GITHUB_RUN_ID}"
          git add -A -- logs/ "$repair_dir" glow/audits/repairs/repair_receipts.jsonl
          if test -f glow/audits/quarantine_index.jsonl; then
            git add -A -- glow/audits/quarantine_index.jsonl
          fi
          if git diff --cached --quiet -- logs/ "$repair_dir" glow/audits/repairs/repair_receipts.jsonl glow/audits/quarantine_index.jsonl; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
          else
            echo "patched=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push repairs
        id: publish
        if: always() && steps.stage.outputs.patched == 'true'
        run: |
          branch="auto-repair/audit-${GITHUB_RUN_ID}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore: preserve safe audit repair evidence"
          git push origin "$branch"
      - name: Open repair PR
        if: always() && steps.stage.outputs.patched == 'true' && steps.publish.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repository } = await github.rest.repos.get(context.repo);
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `auto-repair/audit-${process.env.GITHUB_RUN_ID}`,
              base: repository.default_branch,
              title: `audit repair evidence ${process.env.GITHUB_RUN_ID}`,
              body: 'Contains the safe-repair plan, result, append-only receipts, quarantine evidence, and any repaired logs. Strict verification is rerun after applying safe repairs; unresolved findings keep the workflow failed.',
            });
      - name: Fail if audit verification remains unsuccessful
        if: always() && (steps.final.outputs.status != '0' || steps.final.outcome != 'success')
        run: |
          echo "Strict audit verification remains unsuccessful after safe repairs" >&2
          exit 1
