name: Windows Custody

on:
  pull_request:
    paths:
      - ".github/workflows/windows-custody.yml"
      - "requirements-codex.txt"
      - "sentientos/windows_handle_custody.py"
      - "sentientos/windows_peer_replay_custody.py"
      - "sentientos/federation/peer_replay_owner.py"
      - "sentientos/federation/peer_health_source_factory.py"
      - "sentientos/work_plan.py"
      - "sentientos/tests/test_windows_handle_custody.py"
      - "sentientos/bounded_subprocess.py"
      - "tests/test_codex_landing_process_supervision.py"
  push:
    branches:
      - main
      - 'codex/construct-sentientos*'
    paths:
      - ".github/workflows/windows-custody.yml"
      - "requirements-codex.txt"
      - "sentientos/windows_handle_custody.py"
      - "sentientos/windows_peer_replay_custody.py"
      - "sentientos/federation/peer_replay_owner.py"
      - "sentientos/federation/peer_health_source_factory.py"
      - "sentientos/work_plan.py"
      - "sentientos/tests/test_windows_handle_custody.py"
      - "sentientos/bounded_subprocess.py"
      - "tests/test_codex_landing_process_supervision.py"

permissions:
  contents: read

jobs:
  windows-custody:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canonical test dependencies
        run: "python -m pip install --only-binary=:all: -r requirements-codex.txt"
      - name: Install this checkout as the tested package
        run: python -m pip install --no-deps -e .
      - name: Run Windows custody regressions
        run: python -m scripts.run_tests sentientos/tests/test_windows_handle_custody.py -q
      - name: Bind native ACL regressions to exact task acceptance
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodes = @(
            "sentientos/tests/test_windows_handle_custody.py::test_private_acl_rejects_broad_write_grants[directory]",
            "sentientos/tests/test_windows_handle_custody.py::test_private_acl_rejects_broad_write_grants[file]",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_rejects_existing_alternate_data_stream",
            "sentientos/tests/test_windows_handle_custody.py::test_reader_rejects_case_alias_selection_before_open",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_returns_selected_files_in_deterministic_order",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_private_root_identity_is_observed_without_mutation",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_rejects_changed_operator_pinned_root",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_rejects_changed_operator_pinned_root",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_recovers_signed_history_without_mutation",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_rejects_recomputed_signature_tamper",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_requires_existing_private_bounded_history",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_factory_binds_operator_pin_to_existing_replay_root",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_retains_earlier_handles_until_complete",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_rechecks_acl_before_releasing_inputs[directory]",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_reader_rechecks_acl_before_releasing_inputs[earlier_file]",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_create_retry_and_conflict",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_preserves_destination_race",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_blocks_root_and_stage_substitution",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_crash_retry_preserves_evidence[prepared]",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_crash_retry_preserves_evidence[committed]",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_preserves_commit_after_flush_boundary_failure",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_enforces_bounds_and_parent_custody",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_publication_rejects_aliased_existing_record",
            "sentientos/tests/test_windows_handle_custody.py::test_windows_replay_owner_publishes_and_reverifies_signed_outcomes"
          )
          $manifest = [ordered]@{
            schema_version = "sentientos.task_acceptance:v1"
            task_classification = "behavior_adding"
            repository_sha = $head
            test_provenance_path = "glow/test_runs/test_run_provenance.json"
            required_nodes = @($nodes | ForEach-Object { @{ node_id = $_ } })
            successful_path_nodes = $nodes
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "windows-custody-acceptance.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path $manifestPath -Encoding utf8NoBOM
          python scripts/verify_task_acceptance.py --manifest $manifestPath --provenance glow\test_runs\test_run_provenance.json --output (Join-Path $env:RUNNER_TEMP "windows-custody-acceptance-result.json")
      - name: Upload exact Windows custody acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-custody-exact-acceptance
          path: |
            ${{ runner.temp }}/windows-custody-acceptance.json
            ${{ runner.temp }}/windows-custody-acceptance-result.json
            glow/test_runs/test_run_provenance.json
          if-no-files-found: ignore
      - name: Run bounded subprocess supervision regressions
        run: python -m scripts.run_tests tests/test_codex_landing_process_supervision.py -q
