name: Nightly Self Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nightly-self-check.yml"
      - "glow/contracts/canonical_typing_baseline.json"
      - "mypy.ini"
      - "privilege_lint_cli.py"
      - "pyproject.toml"
      - "requirements-codex.txt"
      - "scripts/analyze_test_provenance.py"
      - "scripts/check_mypy_baseline.py"
      - "scripts/mypy_baseline_common.py"
      - "scripts/pytest_airlock_guard.py"
      - "scripts/run_tests.py"
      - "scripts/verify_audits.py"
      - "sentientos/audit_chain_gate.py"
      - "sentientos/audit_recovery.py"
      - "sentientos/audit_sink.py"
      - "sentientos/audit_strict_status.py"
      - "sentientos/privilege.py"
      - "sentientos/runtime_governor.py"
      - "tests/**
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - name: Verify hosted Administrator availability
        run: test "$(sudo -n id -u)" = "0"
      - name: Install canonical test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-codex.txt
      - name: Verify audits
        run: |
          sudo -n env "PATH=$PATH" "PYTHONPATH=$GITHUB_WORKSPACE" \
            python -m scripts.verify_audits logs/ --strict --no-input
        env:
          LUMOS_AUTO_APPROVE: '1'
      - name: Privilege lint
        run: python -m privilege_lint_cli --read-only --quiet .
        env:
          LUMOS_AUTO_APPROVE: '1'
      - name: Run mypy
        run: python scripts/check_mypy_baseline.py
      - name: Pytest airlock guard
        run: python scripts/pytest_airlock_guard.py
      - name: Run pytest
        run: python -m scripts.run_tests
        env:
          SENTIENTOS_CI_REQUIRE_DEFAULT_INTENT: "1"
          SENTIENTOS_CI_MIN_PASSED: "1"
          SENTIENTOS_CI_MAX_SKIP_RATE: "0.20"
          SENTIENTOS_CI_MAX_XFAIL_RATE: "0.10"
      - name: Analyze test provenance trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain

      - name: Analyze router telemetry trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain --output glow/test_runs/router_telemetry_report.json

      - name: Upload test run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_run_provenance_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/test_runs/test_run_provenance.json
            glow/test_runs/provenance/*.json

      - name: Upload test trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_trend_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/test_trend_report.json

      - name: Upload router telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router_telemetry_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/router_telemetry_report.json
