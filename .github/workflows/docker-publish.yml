name: Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PULSE_TRUST_EPOCH_ROOT: .ci-runtime/pulse-trust-epoch
  PULSE_TRUST_EPOCH_STATE: .ci-runtime/pulse-trust-epoch/epoch_state.json
  SENTIENTOS_HEADLESS: "1"
  SENTIENTOS_GOVERNOR_ROOT: .ci-runtime/docker-governor
  SENTIENTOS_FEDERATION_ROOT: .ci-runtime/docker-federation
  SENTIENTOS_AUDIT_RUNTIME_DIR: /tmp/sentientos-docker-audit-runtime
  SENTIENTOS_CONTROL_KERNEL_ROOT: /tmp/sentientos-docker-control-kernel
  SENTIENTOS_RUNTIME_STATE_ROOT: /tmp/sentientos-docker-runtime-state
  SENTIENTOS_DATA_DIR: /tmp/sentientos-docker-data
  SENTIENTOS_HEARTBEAT_PATH: /tmp/sentientos-docker-pulse/heartbeat.snap

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install --only-binary=:all: -r requirements-codex.txt
          python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
        env:
          SENTIENTOS_TEST_RUN_DIR: /tmp/sentientos-docker-precommit-test-runs

      - name: Capture pre-commit working tree changes
        if: always()
        run: |
          git status --short --untracked-files=all
          git diff --stat
          git diff --name-only
          git diff --cached --name-only

      - name: Run tests
        run: python -m scripts.run_tests
        env:
          SENTIENTOS_CI_REQUIRE_DEFAULT_INTENT: "1"
          SENTIENTOS_CI_MIN_PASSED: "1"
          SENTIENTOS_CI_MAX_SKIP_RATE: "0.20"
          SENTIENTOS_CI_MAX_XFAIL_RATE: "0.10"

      - name: Analyze test provenance trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain

      - name: Analyze router telemetry trends
        if: always()
        run: python scripts/analyze_test_provenance.py --dir glow/test_runs/provenance --verify-chain --output glow/test_runs/router_telemetry_report.json

      - name: Upload test run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_run_provenance_${{ github.run_id }}_${{ github.job }}
          path: |
            glow/test_runs/test_run_provenance.json
            glow/test_runs/provenance/*.json

      - name: Upload test trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_trend_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/test_trend_report.json


      - name: Upload router telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router_telemetry_report_${{ github.run_id }}_${{ github.job }}
          path: glow/test_runs/router_telemetry_report.json
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/zombinator85/sentientos:latest
          context: .
